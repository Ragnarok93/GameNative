name: Prepare GameNative Vulkan renderer
description: Rebuild the current arm64 VulkanRenderer sources before Android packaging
inputs:
  ndk-version:
    description: Android NDK revision used by the GameNative native build
    required: false
    default: '27.3.13750724'
runs:
  using: composite
  steps:
    - name: Build current arm64 Vulkan renderer
      shell: bash
      env:
        ANDROID_NDK_VERSION: ${{ inputs.ndk-version }}
      run: |
        set -euo pipefail

        python3 tools/host_display_timing_test.py
        python3 tools/native_lsfg_pacer_test.py

        marker='gamenative-host-display-confirmation-v3-split-present-worker'
        native_root=app/src/main/cpp
        renderer_root="$native_root/vulkan-renderer-build"
        adrenotools_dir="$native_root/extras/adrenotools"
        build_dir="$RUNNER_TEMP/gamenative-vulkan-renderer-arm64"

        git submodule sync -- "$adrenotools_dir"
        git submodule update --init --recursive -- "$adrenotools_dir"

        sudo apt-get update -qq
        sudo apt-get install -y cmake ninja-build glslang-tools file

        sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
        sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        if [[ -z "$sdk_root" ]]; then
          echo 'ERROR: Android SDK root is not configured' >&2
          exit 1
        fi
        ndk_root="$sdk_root/ndk/${ANDROID_NDK_VERSION}"
        toolchain="$ndk_root/build/cmake/android.toolchain.cmake"
        test -f "$toolchain"

        rm -rf "$build_dir"
        cmake -S "$renderer_root" -B "$build_dir" -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE="$toolchain" \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-26 \
          -DANDROID_STL=c++_shared
        cmake --build "$build_dir" --target vulkan_renderer -- -j2

        built="$build_dir/libvulkan_renderer.so"
        if [[ ! -s "$built" ]]; then
          built="$(find "$build_dir" -type f -name 'libvulkan_renderer.so' -print -quit)"
        fi
        test -n "${built:-}"
        test -s "$built"

        if ! grep -aFq "$marker" "$built"; then
          echo "ERROR: rebuilt Vulkan renderer does not contain $marker" >&2
          exit 1
        fi

        for flavor in legacy modern; do
          destination="app/src/$flavor/jniLibs/arm64-v8a/libvulkan_renderer.so"
          mkdir -p "$(dirname "$destination")"
          cp "$built" "$destination"
          test -s "$destination"
          grep -aFq "$marker" "$destination"
        done

        grep -aFq 'gamenative-native-lsfg-v1.3-complete' "$built"
        file "$built"
        sha256sum "$built"

