name: Adaptive Flow APK handoff

on:
  push:
    branches:
      - fix/adaptive-flow-apk-handoff-20260918

permissions:
  actions: read
  contents: read

jobs:
  split-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/source
          gh run download 35311658894             --repo Ragnarok93/GameNative             --name gamenative-legacy-debug             --dir /tmp/source
          APK="$(find /tmp/source -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Split APK for connector handoff
        run: |
          set -euo pipefail
          mkdir -p /tmp/parts
          sha256sum "$APK" | tee /tmp/parts/gamenative-legacy-debug.sha256
          split -b 280M -d -a 2 "$APK" /tmp/parts/gamenative-legacy-debug.apk.part-
          ls -lh /tmp/parts

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-apk-part-00
          path: /tmp/parts/gamenative-legacy-debug.apk.part-00
          compression-level: 0
          if-no-files-found: error

      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-apk-part-01
          path: /tmp/parts/gamenative-legacy-debug.apk.part-01
          compression-level: 0
          if-no-files-found: error

      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-apk-part-02
          path: /tmp/parts/gamenative-legacy-debug.apk.part-02
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-apk-checksum
          path: /tmp/parts/gamenative-legacy-debug.sha256
          compression-level: 0
          if-no-files-found: error
