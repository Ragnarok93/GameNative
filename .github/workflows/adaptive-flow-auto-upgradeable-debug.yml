name: Adaptive Flow Auto Upgradeable Debug

on:
  push:
    branches:
      - "build/adaptive-flow-auto-upgradeable-20260928"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gamenative-adaptive-flow-auto-upgradeable-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build adaptive-flow upgradeable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout GameNative
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Prepare pinned LSFG native runtime
        uses: ./.github/actions/prepare-lsfg-native

      - name: Verify persistent debug signing identity
        shell: bash
        run: |
          set -euo pipefail
          keystore=".github/debug-signing/gamenative-upgrade-debug.jks"
          test -s "$keystore"
          keytool -list -v             -keystore "$keystore"             -storepass android             -alias gamenative-upgrade-debug |
            sed -n 's/^[[:space:]]*SHA256: /Upgradeable debug signer SHA256: /p'

      - name: Generate version-independent debug metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail
          epoch_2020=1577836800
          now="$(date -u +%s)"
          version_code=$((1000000 + (now - epoch_2020) / 60))
          version_name="adaptive-flow-auto-debug-${GITHUB_SHA::12}"

          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$version_name" >> "$GITHUB_ENV"

      - name: Inject non-production service credentials
        shell: bash
        run: |
          cat > local.properties <<'EOF'
          POSTHOG_API_KEY=dummy
          POSTHOG_HOST=https://us.i.posthog.com
          STEAMGRIDDB_API_KEY=dummy
          CLOUD_PROJECT_NUMBER=dummy
          EOF

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run adaptive-flow and frame-rating tests
        run: >-
          ./gradlew :app:testLegacyDebugUnitTest --no-daemon
          --tests app.gamenative.utils.LsfgVkManagerTest
          --tests app.gamenative.utils.LsfgQuickMenuHelperModeTest
          --tests app.gamenative.utils.LsfgAdaptiveFlowUiContractTest
          --tests app.gamenative.utils.LsfgBuildWorkflowContractTest
          --tests app.gamenative.powercontrol.metrics.FrameTimeRingTest
          --tests com.winlator.widget.FrameRatingTest
          --tests com.winlator.widget.XServerFrameRatingRetargetContractTest

      - name: Build upgradeable LegacyDebug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew             -PupgradeSafeDebugSigning=true             -PciVersionCode="$VERSION_CODE"             -PciVersionName="$VERSION_NAME"             :app:assembleLegacyDebug             --no-daemon

      - name: Verify update identity and native provenance
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t apks < <(
            find app/build/outputs/apk/legacy/debug               -maxdepth 1 -type f -name '*.apk' -print
          )
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one LegacyDebug APK, found ${#apks[@]}."
            printf '%s\n' "${apks[@]}"
            exit 1
          fi

          apk="${apks[0]}"
          stage="$RUNNER_TEMP/gamenative-adaptive-flow-auto-upgradeable-debug"
          mkdir -p "$stage"
          staged_apk="$stage/GameNative-adaptive-flow-auto-upgradeable-debug.apk"
          cp "$apk" "$staged_apk"

          expected_native_commit="$(git rev-parse HEAD:app/src/main/cpp/lsfg-vk-android)"
          unzip -p "$staged_apk" 'lib/arm64-v8a/liblsfg-vk-layer.so' |
            grep -aFq "$expected_native_commit"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          aapt="$(
            find "$sdk_root" -path '*/build-tools/*/aapt'               -type f -print | sort -V | tail -n 1
          )"
          apksigner="$(
            find "$sdk_root" -path '*/build-tools/*/apksigner'               -type f -print | sort -V | tail -n 1
          )"
          test -x "$aapt"
          test -x "$apksigner"

          badging="$("$aapt" dump badging "$staged_apk" | head -n 1)"
          [[ "$badging" == *"name='app.gamenative'"* ]]
          [[ "$badging" == *"versionCode='$VERSION_CODE'"* ]]
          [[ "$badging" == *"versionName='$VERSION_NAME'"* ]]

          expected_cert="$(
            keytool -list -v               -keystore .github/debug-signing/gamenative-upgrade-debug.jks               -storepass android               -alias gamenative-upgrade-debug |
              sed -n 's/^[[:space:]]*SHA256: //p' |
              head -n 1 |
              tr -d ':' |
              tr '[:upper:]' '[:lower:]'
          )"
          signer_report="$stage/signing-report.txt"
          "$apksigner" verify --verbose --print-certs "$staged_apk" |
            tee "$signer_report"
          actual_cert="$(
            sed -n 's/^.*Signer: certificate SHA-256 digest: //p' "$signer_report" |
              head -n 1 |
              tr -d ':' |
              tr '[:upper:]' '[:lower:]'
          )"

          test -n "$expected_cert"
          test -n "$actual_cert"
          [[ "$actual_cert" == "$expected_cert" ]]

          {
            echo "game_commit=$GITHUB_SHA"
            echo "adaptive_feature_base=8bda6d99c6831718922bd99a05a3e1f073d4c4e5"
            echo "lsfg_native_commit=$expected_native_commit"
            echo "application_id=app.gamenative"
            echo "version_code=$VERSION_CODE"
            echo "version_name=$VERSION_NAME"
            echo "signing_cert_sha256=$actual_cert"
          } > "$stage/build-metadata.txt"

          sha256sum "$staged_apk" > "$stage/GameNative-adaptive-flow-auto-upgradeable-debug.apk.sha256"

      - name: Upload upgradeable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GameNative-adaptive-flow-auto-upgradeable-debug
          path: |
            ${{ runner.temp }}/gamenative-adaptive-flow-auto-upgradeable-debug/GameNative-adaptive-flow-auto-upgradeable-debug.apk
            ${{ runner.temp }}/gamenative-adaptive-flow-auto-upgradeable-debug/GameNative-adaptive-flow-auto-upgradeable-debug.apk.sha256
            ${{ runner.temp }}/gamenative-adaptive-flow-auto-upgradeable-debug/build-metadata.txt
            ${{ runner.temp }}/gamenative-adaptive-flow-auto-upgradeable-debug/signing-report.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  handoff:
    name: Split APK for connector handoff
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download built upgradeable debug artifact
        uses: actions/download-artifact@v4
        with:
          name: GameNative-adaptive-flow-auto-upgradeable-debug
          path: source

      - name: Split and validate APK
        shell: bash
        run: |
          set -euo pipefail
          apk="source/GameNative-adaptive-flow-auto-upgradeable-debug.apk"
          checksum="source/GameNative-adaptive-flow-auto-upgradeable-debug.apk.sha256"
          test -s "$apk"
          test -s "$checksum"
          expected_sha="$(awk '{print $1}' "$checksum" | head -n 1)"
          actual_sha="$(sha256sum "$apk" | awk '{print $1}')"
          test -n "$expected_sha"
          [[ "$actual_sha" == "$expected_sha" ]]

          mkdir -p handoff
          cp source/build-metadata.txt handoff/
          cp source/GameNative-adaptive-flow-auto-upgradeable-debug.apk.sha256 handoff/
          split -b 250M -d -a 2 "$apk" handoff/GameNative-adaptive-flow-auto-upgradeable-debug.apk.part-
          test -s handoff/GameNative-adaptive-flow-auto-upgradeable-debug.apk.part-00
          test -s handoff/GameNative-adaptive-flow-auto-upgradeable-debug.apk.part-01
          test -s handoff/GameNative-adaptive-flow-auto-upgradeable-debug.apk.part-02

      - name: Upload APK part 00
        uses: actions/upload-artifact@v4
        with:
          name: GameNative-adaptive-flow-auto-upgradeable-debug-part-00
          path: handoff/GameNative-adaptive-flow-auto-upgradeable-debug.apk.part-00
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload APK part 01
        uses: actions/upload-artifact@v4
        with:
          name: GameNative-adaptive-flow-auto-upgradeable-debug-part-01
          path: handoff/GameNative-adaptive-flow-auto-upgradeable-debug.apk.part-01
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload APK part 02
        uses: actions/upload-artifact@v4
        with:
          name: GameNative-adaptive-flow-auto-upgradeable-debug-part-02
          path: handoff/GameNative-adaptive-flow-auto-upgradeable-debug.apk.part-02
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload handoff metadata
        uses: actions/upload-artifact@v4
        with:
          name: GameNative-adaptive-flow-auto-upgradeable-debug-handoff-metadata
          path: |
            handoff/build-metadata.txt
            handoff/GameNative-adaptive-flow-auto-upgradeable-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
