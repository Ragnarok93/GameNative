name: Apply Adaptive GameNative fix

on:
  push:
    branches:
      - Adaptive-Frame-Generation

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'stage GameNative production patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Adaptive-Frame-Generation
          fetch-depth: 0
          submodules: false
      - name: Apply single-authority pacing fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          present_path = Path('app/src/main/java/com/winlator/xserver/extensions/PresentExtension.java')
          present = present_path.read_text()

          old_transition = '''    /**\n     * Record the requested pacing owner. LSFG does not actually receive pacing\n     * ownership until its fresh native stats state confirms a ready swapchain\n     * context; until then the normal X Present limiter remains active.\n     */\n    public void transitionFramePacing(boolean lsfgOwnsPacing, int limit) {\n        this.lsfgPacingRequested = lsfgOwnsPacing;\n        this.localFrameRateLimit = Math.max(0, limit);\n        applyEffectivePacing(lsfgOwnsPacing && LsfgRuntimeGate.isGenerationReady());\n    }\n\n    private void refreshLsfgPacingState() {\n        final boolean lsfgReady = lsfgPacingRequested && LsfgRuntimeGate.isGenerationReady();\n        final int desiredLimit = lsfgReady ? 0 : localFrameRateLimit;\n        if (this.eagerIdleRelease == lsfgReady && this.frameRateLimit == desiredLimit)\n            return;\n        applyEffectivePacing(lsfgReady);\n    }\n\n    private synchronized void applyEffectivePacing(boolean lsfgReady) {\n        final int nextLimit = lsfgReady ? 0 : localFrameRateLimit;'''
          new_transition = '''    /**\n     * Record LSFG presentation ownership without becoming a second FPS limiter.\n     * GameNative already owns source pacing through ShmFramePacer (with the\n     * renderer receiving only a frame-rate hint). X Present therefore remains\n     * unpaced in both native and LSFG modes; fresh native LSFG readiness only\n     * controls eager idle release.\n     */\n    public void transitionFramePacing(boolean lsfgOwnsPacing, int limit) {\n        final boolean ownershipRequestChanged = this.lsfgPacingRequested != lsfgOwnsPacing;\n        this.lsfgPacingRequested = lsfgOwnsPacing;\n        this.localFrameRateLimit = Math.max(0, limit);\n        if (ownershipRequestChanged) windowTimings.clear();\n        applyEffectivePacing(lsfgOwnsPacing && LsfgRuntimeGate.isGenerationReady());\n    }\n\n    private void refreshLsfgPacingState() {\n        final boolean lsfgReady = lsfgPacingRequested && LsfgRuntimeGate.isGenerationReady();\n        final int desiredLimit = 0;\n        if (this.eagerIdleRelease == lsfgReady && this.frameRateLimit == desiredLimit)\n            return;\n        applyEffectivePacing(lsfgReady);\n    }\n\n    private synchronized void applyEffectivePacing(boolean lsfgReady) {\n        final int nextLimit = 0;'''
          if old_transition not in present:
              raise SystemExit('Present ownership transition anchor not found')
          present = present.replace(old_transition, new_transition, 1)
          present_path.write_text(present)

          power_path = Path('app/src/main/java/app/gamenative/powercontrol/PowerManager.kt')
          power = power_path.read_text()
          old_apply = '''        val xServerView = PluviaApp.xServerView ?: return false\n        val presentExtension = xServerView.getxServer()\n            ?.getExtension<PresentExtension>(PresentExtension.MAJOR_OPCODE.toInt())\n\n        val apply = Runnable {\n            xServerView.setFrameRateLimit(limitFps)\n            presentExtension?.setFrameRateLimit(limitFps)\n            com.winlator.xserver.ShmFramePacer.setFrameRateLimit(limitFps)\n        }'''
          new_apply = '''        val xServerView = PluviaApp.xServerView ?: return false\n\n        val apply = Runnable {\n            // One source-pacing authority only: SHM pacing owns the real cap and\n            // the renderer receives its platform frame-rate hint. Present idle\n            // notification pacing is intentionally not used as a second limiter.\n            xServerView.setFrameRateLimit(limitFps)\n            com.winlator.xserver.ShmFramePacer.setFrameRateLimit(limitFps)\n        }'''
          if old_apply not in power:
              raise SystemExit('PowerManager pacing anchor not found')
          power = power.replace(old_apply, new_apply, 1)
          if 'PresentExtension' not in power.replace('import com.winlator.xserver.extensions.PresentExtension\n', ''):
              power = power.replace('import com.winlator.xserver.extensions.PresentExtension\n', '', 1)
          power_path.write_text(power)
          PY
      - name: Run focused Adaptive regression tests
        run: |
          ./gradlew :app:testLegacyDebugUnitTest \
            --tests 'com.winlator.xserver.extensions.PresentExtensionPacingTransitionTest' \
            --tests 'app.gamenative.utils.LsfgVkManagerTest' \
            --no-daemon
      - name: Commit production fix
        shell: bash
        run: |
          rm .github/workflows/apply-adaptive-runtime-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(lsfg): use a single source pacing authority"
          git push origin HEAD:Adaptive-Frame-Generation
