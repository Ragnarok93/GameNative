name: Apply LSFG control core

on:
  push:
    branches:
      - Adaptive-Frame-Generation

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'stage lsfg control core')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Adaptive-Frame-Generation
          fetch-depth: 0
          submodules: false

      - name: Apply target arbitration and telemetry parser
        shell: bash
        run: |
          cat > app/src/main/java/app/gamenative/utils/LsfgAdaptiveTargets.kt <<'EOF'
          package app.gamenative.utils

          import kotlin.math.min

          /**
           * Explicit frame-rate ownership model for the game/render pipeline.
           *
           * [sourceFpsTarget] is the game/base-render target. [outputFpsTarget]
           * is the user's requested displayed-frame target. [outputFpsCeiling]
           * is an upstream thermal/power constraint. [resolvedOutputFpsTarget]
           * is the only value that may be sent to native fps_limit.
           */
          data class LsfgAdaptiveTargets(
              val sourceFpsTarget: Int,
              val outputFpsCeiling: Int,
              val outputFpsTarget: Int,
              val resolvedOutputFpsTarget: Int,
          ) {
              /** Compatibility alias for older callers/tests during migration. */
              val sourceLimitFps: Int get() = sourceFpsTarget
          }

          object LsfgAdaptiveTargetPolicy {
              private const val MIN_TARGET_FPS = 5

              fun resolve(
                  adaptiveEnabled: Boolean,
                  sourceLimiterEnabled: Boolean,
                  sourceLimiterTargetFps: Int,
                  requestedOutputTargetFps: Int,
                  displayRefreshRateFps: Int,
                  outputFpsCeiling: Int = 0,
              ): LsfgAdaptiveTargets {
                  val displayCeiling = displayRefreshRateFps.coerceAtLeast(MIN_TARGET_FPS)

                  // The user's limiter preference remains independent from Adaptive.
                  // If Adaptive is enabled without an explicit source limiter, use an
                  // ephemeral display-rate target so the native source target is always
                  // well-defined without mutating fpsLimiterEnabled or its saved value.
                  val sourceTarget = when {
                      sourceLimiterEnabled -> sourceLimiterTargetFps.coerceIn(MIN_TARGET_FPS, displayCeiling)
                      adaptiveEnabled -> displayCeiling
                      else -> 0
                  }

                  val userTarget = (requestedOutputTargetFps.takeIf { it > 0 } ?: displayCeiling)
                      .coerceIn(MIN_TARGET_FPS, displayCeiling)
                  val thermalCeiling = (outputFpsCeiling.takeIf { it > 0 } ?: displayCeiling)
                      .coerceIn(MIN_TARGET_FPS, displayCeiling)
                  val resolved = min(userTarget, min(thermalCeiling, displayCeiling))

                  return LsfgAdaptiveTargets(
                      sourceFpsTarget = sourceTarget,
                      outputFpsCeiling = thermalCeiling,
                      outputFpsTarget = userTarget,
                      resolvedOutputFpsTarget = resolved,
                  )
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/app/gamenative/utils/LsfgVkManager.kt')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'{label} anchor not found')
              text = text.replace(old, new, 1)

          replace_once(
              '''internal data class LsfgRuntimeStats(\n    val outputFps: Float,\n    val sourceFps: Float,\n    val generatedFps: Float,\n) {''',
              '''internal data class LsfgRuntimeStats(\n    val outputFps: Float,\n    val sourceFps: Float,\n    val generatedFps: Float,\n    val sourceFrames: Int,\n    val generatedFrames: Int,\n    val generatedPerSource: Float,\n) {''',
              'runtime stats data class',
          )
          replace_once(
              '''            fun fps(name: String): Float? = values[name]?.toFloatOrNull()\n                ?.takeIf { it.isFinite() && it >= 0f }\n\n            return LsfgRuntimeStats(\n                outputFps = fps("fps") ?: return null,\n                sourceFps = fps("source_fps") ?: return null,\n                generatedFps = fps("generated_fps") ?: 0f,\n            )''',
              '''            fun fps(name: String): Float? = values[name]?.toFloatOrNull()\n                ?.takeIf { it.isFinite() && it >= 0f }\n            fun count(name: String): Int = values[name]?.toIntOrNull()?.coerceAtLeast(0) ?: 0\n\n            val sourceFrames = count("source_frames")\n            val generatedFrames = count("generated_frames")\n            val measuredRatio = values["generated_per_source"]?.toFloatOrNull()\n                ?.takeIf { it.isFinite() && it >= 0f }\n                ?: if (sourceFrames > 0) generatedFrames.toFloat() / sourceFrames.toFloat() else 0f\n\n            return LsfgRuntimeStats(\n                outputFps = fps("fps") ?: return null,\n                sourceFps = fps("source_fps") ?: return null,\n                generatedFps = fps("generated_fps") ?: 0f,\n                sourceFrames = sourceFrames,\n                generatedFrames = generatedFrames,\n                generatedPerSource = measuredRatio,\n            )''',
              'runtime stats parser',
          )
          replace_once(
              '    const val EXTRA_ADAPTIVE_OUTPUT_TARGET = "lsfgAdaptiveOutputTarget"\n',
              '    const val EXTRA_ADAPTIVE_OUTPUT_TARGET = "lsfgAdaptiveOutputTarget"\n    const val EXTRA_ADAPTIVE_OUTPUT_CEILING = "lsfgAdaptiveOutputCeiling"\n',
              'output target extra',
          )
          replace_once(
              '''    /** Persist an explicit Adaptive FrameGen output target. */\n    fun setAdaptiveOutputTarget(container: Container, targetFps: Int): Int {''',
              '''    /** Thermal/power ceiling for the final displayed-frame target. Zero means unconstrained. */\n    fun adaptiveOutputCeiling(container: Container): Int =\n        container.getExtra(EXTRA_ADAPTIVE_OUTPUT_CEILING, "0")\n            ?.toIntOrNull()\n            ?.coerceAtLeast(0)\n            ?: 0\n\n    fun resolvedAdaptiveOutputTarget(container: Container): Int {\n        val target = adaptiveOutputTarget(container)\n        val ceiling = adaptiveOutputCeiling(container)\n        return when {\n            target <= 0 -> ceiling\n            ceiling <= 0 -> target\n            else -> minOf(target, ceiling)\n        }\n    }\n\n    /** Persist an explicit Adaptive FrameGen output target. */\n    fun setAdaptiveOutputTarget(container: Container, targetFps: Int): Int {''',
              'ceiling methods',
          )
          text = text.replace('            val outputTarget = adaptiveOutputTarget(container)\n            val adaptiveEffective = frameGenActive && adaptiveFrameGen(container) && outputTarget > 0',
                              '            val outputTarget = resolvedAdaptiveOutputTarget(container)\n            val adaptiveEffective = frameGenActive && adaptiveFrameGen(container) && outputTarget > 0', 1)
          text = text.replace('        val outputTarget = adaptiveOutputTarget(container)\n        Timber.tag(TAG).i(',
                              '        val outputTarget = resolvedAdaptiveOutputTarget(container)\n        Timber.tag(TAG).i(', 1)

          # The vsync publisher owns the display clock only. Runtime configuration
          # is now exclusively published by the session coordinator.
          old_vsync = '''                                val selectedMultiplier = multiplier(container)\n                                updateConfigAtRuntime(\n                                    container = container,\n                                    enabled = selectedMultiplier >= 2,\n                                    multiplier = if (selectedMultiplier >= 2) selectedMultiplier else 2,\n                                    flowScale = flowScale(container),\n                                    performanceMode = performanceMode(container),\n                                    adaptiveFrameGen = adaptiveFrameGen(container),\n                                    fpsLimitOverride = outputTarget,\n                                )\n                                Timber.tag(TAG).i(\n                                    "LSFG output cadence initialized from display refresh: %d fps",\n                                    outputTarget,\n                                )'''
          new_vsync = '''                                Timber.tag(TAG).i(\n                                    "LSFG output target initialized from display refresh: %d fps",\n                                    outputTarget,\n                                )'''
          if old_vsync not in text:
              raise SystemExit('vsync direct writer anchor not found')
          text = text.replace(old_vsync, new_vsync, 1)

          replace_once(
              '''    /** Source/game FPS for power-control feedback; generated output must not downclock the game. */\n    fun readMeasuredSourceFps(container: Container): Float? {\n        return readRuntimeStats(container)?.sourceFps\n    }''',
              '''    /** Source/game FPS for power-control feedback; generated output must not downclock the game. */\n    fun readMeasuredSourceFps(container: Container): Float? {\n        return readRuntimeStats(container)?.sourceFps\n    }\n\n    /** Measured generated frames per real/source frame for the latest native interval. */\n    fun readMeasuredGeneratedPerSource(container: Container): Float? =\n        readRuntimeStats(container)?.generatedPerSource\n\n    /**\n     * Integer stride for the X-window timestamp ring. Source FPS itself comes\n     * from native telemetry; this stride only prevents generated sub-frame\n     * timestamps from corrupting p50/p95/slow-frame calculations.\n     */\n    fun readMeasuredFrameSampleStride(container: Container): Int? {\n        val ratio = readRuntimeStats(container)?.generatedPerSource ?: return null\n        if (!ratio.isFinite() || ratio < 0f) return null\n        return kotlin.math.ceil(1.0 + ratio.toDouble()).toInt().coerceIn(1, 4)\n    }\n\n    /** Approximate LSFG compute pressure (0..100) from real generation work and flow scale. */\n    fun readMeasuredFrameGenLoadPercent(container: Container): Float? {\n        val ratio = readRuntimeStats(container)?.generatedPerSource ?: return null\n        if (!ratio.isFinite() || ratio < 0f) return null\n        return ((ratio.coerceAtMost(3f) / 3f) * flowScale(container) * 100f).coerceIn(0f, 100f)\n    }''',
              'runtime telemetry accessors',
          )

          path.write_text(text)
          PY

          cat > app/src/test/java/app/gamenative/utils/LsfgAdaptiveTargetsTest.kt <<'EOF'
          package app.gamenative.utils

          import org.junit.Assert.assertEquals
          import org.junit.Test

          class LsfgAdaptiveTargetsTest {
              @Test
              fun userTargetThermalCeilingAndSourceTargetHaveIndependentOwnership() {
                  val targets = LsfgAdaptiveTargetPolicy.resolve(
                      adaptiveEnabled = true,
                      sourceLimiterEnabled = true,
                      sourceLimiterTargetFps = 30,
                      requestedOutputTargetFps = 120,
                      displayRefreshRateFps = 120,
                      outputFpsCeiling = 90,
                  )

                  assertEquals(30, targets.sourceFpsTarget)
                  assertEquals(120, targets.outputFpsTarget)
                  assertEquals(90, targets.outputFpsCeiling)
                  assertEquals(90, targets.resolvedOutputFpsTarget)
              }

              @Test
              fun adaptiveWithoutSourceLimiterGetsEphemeralSourceTargetWithoutChangingPreference() {
                  val targets = LsfgAdaptiveTargetPolicy.resolve(
                      adaptiveEnabled = true,
                      sourceLimiterEnabled = false,
                      sourceLimiterTargetFps = 30,
                      requestedOutputTargetFps = 90,
                      displayRefreshRateFps = 120,
                  )

                  assertEquals(120, targets.sourceFpsTarget)
                  assertEquals(90, targets.resolvedOutputFpsTarget)
              }

              @Test
              fun missingOutputTargetDefaultsToDisplayRefresh() {
                  val targets = LsfgAdaptiveTargetPolicy.resolve(
                      adaptiveEnabled = true,
                      sourceLimiterEnabled = true,
                      sourceLimiterTargetFps = 40,
                      requestedOutputTargetFps = 0,
                      displayRefreshRateFps = 120,
                  )
                  assertEquals(40, targets.sourceFpsTarget)
                  assertEquals(120, targets.outputFpsTarget)
                  assertEquals(120, targets.resolvedOutputFpsTarget)
              }

              @Test
              fun disablingAdaptiveDoesNotDestroyTheIndependentOutputPreference() {
                  val targets = LsfgAdaptiveTargetPolicy.resolve(
                      adaptiveEnabled = false,
                      sourceLimiterEnabled = true,
                      sourceLimiterTargetFps = 45,
                      requestedOutputTargetFps = 120,
                      displayRefreshRateFps = 120,
                  )
                  assertEquals(45, targets.sourceFpsTarget)
                  assertEquals(120, targets.outputFpsTarget)
                  assertEquals(120, targets.resolvedOutputFpsTarget)
              }
          }
          EOF

          cat > app/src/test/java/app/gamenative/utils/LsfgRuntimeStatsTest.kt <<'EOF'
          package app.gamenative.utils

          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertNull
          import org.junit.Test

          class LsfgRuntimeStatsTest {
              @Test
              fun parse_separatesOutputSourceAndMeasuredGenerationRatio() {
                  val stats = LsfgRuntimeStats.parse(
                      """
                      active=1
                      generation_ready=1
                      fps=60.000
                      source_fps=30.000
                      generated_fps=30.000
                      source_frames=30
                      generated_frames=15
                      generated_per_source=0.500
                      """.trimIndent(),
                  )

                  assertEquals(60f, stats?.outputFps)
                  assertEquals(30f, stats?.sourceFps)
                  assertEquals(30, stats?.sourceFrames)
                  assertEquals(15, stats?.generatedFrames)
                  assertEquals(0.5f, stats?.generatedPerSource)
              }

              @Test
              fun parse_derivesRatioFromCountsForTransitionalNativeStats() {
                  val stats = LsfgRuntimeStats.parse(
                      "active=1\nfps=45\nsource_fps=30\ngenerated_fps=15\nsource_frames=30\ngenerated_frames=15",
                  )
                  assertEquals(0.5f, stats?.generatedPerSource)
              }

              @Test
              fun parse_rejectsInactiveOrMalformedFeedback() {
                  assertNull(LsfgRuntimeStats.parse("active=0\nfps=60\nsource_fps=30"))
                  assertNull(LsfgRuntimeStats.parse("active=1\nfps=bad\nsource_fps=30"))
                  assertNull(LsfgRuntimeStats.parse("active=1\nfps=60\nsource_fps=-1"))
              }
          }
          EOF

      - name: Run focused control-core tests
        run: |
          ./gradlew :app:testLegacyDebugUnitTest --tests 'app.gamenative.utils.LsfgAdaptiveTargetsTest' --tests 'app.gamenative.utils.LsfgAdaptiveTargetsContractTest' --tests 'app.gamenative.utils.LsfgRuntimeStatsTest' --no-daemon

      - name: Commit control core
        shell: bash
        run: |
          rm .github/workflows/apply-lsfg-control-core.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor(lsfg): establish explicit target ownership"
          git push origin HEAD:Adaptive-Frame-Generation
