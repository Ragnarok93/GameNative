name: B14 Directional Adaptive Promotion

on:
  workflow_dispatch:
  push:
    branches:
      - feature/adreno-6xx-b14-directional-ahb-adaptive-reload

permissions:
  contents: read

concurrency:
  group: b14-directional-adaptive-${{ github.ref }}
  cancel-in-progress: true

env:
  B14_NATIVE_REVISION: 6a774bac6b775b8aacc7c3d3f34abe12de614f4c

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out GameNative promotion branch
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y spirv-tools file zstd binutils
          spirv-val --version

      - name: Verify exact promoted native gitlink
        shell: bash
        run: |
          set -euo pipefail
          native_dir=app/src/main/cpp/lsfg-vk-android
          expected="$(git rev-parse HEAD:${native_dir})"
          actual="$(git -C "$native_dir" rev-parse HEAD)"
          echo "Committed LSFG gitlink: $expected"
          echo "Checked-out LSFG revision: $actual"
          test "$expected" = "$B14_NATIVE_REVISION"
          test "$actual" = "$B14_NATIVE_REVISION"

      - name: Verify known-good Vulkan wrapper
        shell: bash
        run: |
          set -euo pipefail
          asset=app/src/legacy/assets/graphics_driver/wrapper-gamenative.tzst
          poisoned=2aecf1c11cde57008a3cc5e1a551e095d7843d3aa84b3756953afc134035e7c5
          fixed=1b74eeb77ce522ff741f39152db05d8f777f4180babe59b4911a08d74b91d89c
          tmp="$(mktemp -d)"
          tar --zstd -xf "$asset" -C "$tmp"
          mapfile -t wrappers < <(find "$tmp" -type f -name libvulkan_wrapper.so -print)
          test "${#wrappers[@]}" -eq 1
          sha="$(sha256sum "${wrappers[0]}" | awk '{print $1}')"
          echo "Packaged wrapper SHA-256: $sha"
          test "$sha" != "$poisoned"
          test "$sha" = "$fixed"

      - name: Prepare promoted arm64 B14 runtime
        uses: ./.github/actions/prepare-lsfg-native
        env:
          LSFGVK_ADAPTIVE_RUNTIME: "1"
          LSFGVK_B12_DUAL_STAGE_PROFILE: "1"
          LSFGVK_MIPMAPS_CANDIDATE_SCRIPT: scripts/apply-candidate-b14-mipmaps-tail-fusion.py

      - name: Verify promoted runtime contract
        shell: bash
        run: |
          set -euo pipefail
          layer=app/src/main/jniLibs/arm64-v8a/liblsfg-vk-layer.so
          test -s "$layer"
          strings "$layer" > /tmp/b14-promoted.strings
          for required in \
            'candidate-b11-beta4-pow2-mask' \
            'candidate-b13-beta4-fused-mask' \
            'candidate-b14-mipmaps-tail-fusion' \
            'ahb-directional-transport' \
            'config-reload-soft-toggle' \
            'b12-stage-profile-init' \
            'mipmaps_avg_ms=' \
            'beta4_avg_ms='; do
            grep -Fq "$required" /tmp/b14-promoted.strings || {
              echo "ERROR: promoted runtime missing marker: $required" >&2
              exit 1
            }
          done
          for forbidden in \
            'candidate-b15-mip4-topology' \
            'candidate-b15-mip4-register-fusion' \
            'candidate-fp16-motion-compaction' \
            'ir3_gate=probe' \
            'ir3_gate=proven'; do
            if grep -Fq "$forbidden" /tmp/b14-promoted.strings; then
              echo "ERROR: unpromoted B15/FP16 marker present: $forbidden" >&2
              exit 1
            fi
          done
          native_sha="$(sha256sum "$layer" | awk '{print $1}')"
          printf '%s\n' "$native_sha" > /tmp/promoted-native-sha
          echo "Promoted arm64 LSFG SHA-256: $native_sha"

      - name: Inject debug credentials
        shell: bash
        run: |
          printf 'POSTHOG_API_KEY=dummy\n' > local.properties
          printf 'POSTHOG_HOST=https://us.i.posthog.com\n' >> local.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Legacy unit tests
        run: ./gradlew :app:testLegacyDebugUnitTest --no-daemon

      - name: Assemble promoted LegacyDebug APK
        run: ./gradlew :app:assembleLegacyDebug --no-daemon

      - name: Verify exact promoted runtime inside APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/legacy/debug -maxdepth 1 -type f -name '*.apk' -print)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          tmp="$(mktemp -d)"
          unzip -p "$apk" lib/arm64-v8a/liblsfg-vk-layer.so > "$tmp/liblsfg-vk-layer.so"
          packaged_sha="$(sha256sum "$tmp/liblsfg-vk-layer.so" | awk '{print $1}')"
          expected_sha="$(cat /tmp/promoted-native-sha)"
          echo "Fresh native SHA-256: $expected_sha"
          echo "APK native SHA-256:   $packaged_sha"
          test "$packaged_sha" = "$expected_sha"
          strings "$tmp/liblsfg-vk-layer.so" > "$tmp/apk-lsfg.strings"
          for required in \
            'candidate-b14-mipmaps-tail-fusion' \
            'ahb-directional-transport' \
            'config-reload-soft-toggle'; do
            grep -Fq "$required" "$tmp/apk-lsfg.strings" || exit 1
          done
          for forbidden in \
            'candidate-b15-mip4-topology' \
            'candidate-b15-mip4-register-fusion' \
            'candidate-fp16-motion-compaction'; do
            ! grep -Fq "$forbidden" "$tmp/apk-lsfg.strings" || exit 1
          done
          cp "$apk" gamenative-adreno-b14-directional-adaptive.apk
          apk_sha="$(sha256sum gamenative-adreno-b14-directional-adaptive.apk | awk '{print $1}')"
          {
            echo "GameNative commit: $GITHUB_SHA"
            echo "LSFG commit: $B14_NATIVE_REVISION"
            echo "Native SHA-256: $expected_sha"
            echo "APK SHA-256: $apk_sha"
            echo "B15 register fusion: disabled"
            echo "FP16 motion compaction: disabled"
          } | tee gamenative-adreno-b14-directional-adaptive-manifest.txt

      - name: Upload verified promotion APK
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-adreno-b14-directional-adaptive
          path: |
            gamenative-adreno-b14-directional-adaptive.apk
            gamenative-adreno-b14-directional-adaptive-manifest.txt
          if-no-files-found: error
          compression-level: 0
