name: B14 Fixed Wrapper Validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/adreno-6xx-candidate-b11-beta4-pow2-mask
    paths:
      - .github/workflows/b14-fixed-wrapper-validation.yml

permissions:
  contents: read

concurrency:
  group: b14-fixed-wrapper-${{ github.ref }}
  cancel-in-progress: true

env:
  B14_NATIVE_REVISION: 7fee0ef6299da1171b7a0196759714f007ccf108

jobs:
  validate-b14:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out GameNative candidate
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Verify committed wrapper is the known subgroup-capable build
        shell: bash
        run: |
          set -euo pipefail
          asset=app/src/legacy/assets/graphics_driver/wrapper-gamenative.tzst
          poisoned=2aecf1c11cde57008a3cc5e1a551e095d7843d3aa84b3756953afc134035e7c5
          fixed=1b74eeb77ce522ff741f39152db05d8f777f4180babe59b4911a08d74b91d89c
          tmp="$(mktemp -d)"
          tar --zstd -xf "$asset" -C "$tmp"
          mapfile -t wrappers < <(find "$tmp" -type f -name libvulkan_wrapper.so -print)
          test "${#wrappers[@]}" -eq 1
          sha="$(sha256sum "${wrappers[0]}" | awk '{print $1}')"
          echo "Packaged wrapper SHA-256: $sha"
          test "$sha" != "$poisoned"
          test "$sha" = "$fixed"

      - name: Check out pinned Mesa wrapper source
        uses: actions/checkout@v5
        with:
          repository: GameNative/mesa
          ref: cd0c2eb5482dbd51e196018799a0c9ee1b0e4226
          path: mesa-wrapper

      - name: Prove subgroup regression and patch contract
        shell: bash
        run: |
          set -euo pipefail
          source=mesa-wrapper/src/vulkan/wrapper/wrapper_physical_device.c
          set +e
          python3 scripts/wrapper/test_subgroup_forwarding.py "$source" >/tmp/red.log 2>&1
          red_status=$?
          set -e
          cat /tmp/red.log
          test "$red_status" -ne 0
          grep -Fq SUBGROUP_FORWARDING_REGRESSION /tmp/red.log
          python3 scripts/wrapper/apply_subgroup_forwarding_fix.py "$source"
          python3 scripts/wrapper/test_subgroup_forwarding.py "$source"
          if grep -Eq '(subgroup_prop->supported(Operations|Stages)|vk11_prop->subgroupSupported(Operations|Stages))[[:space:]]*=' "$source"; then
            echo 'ERROR: subgroup capability poisoning remains after patch' >&2
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y spirv-tools file zstd
          spirv-val --version

      - name: Record pinned B14 native revision
        shell: bash
        run: |
          set -euo pipefail
          native_dir=app/src/main/cpp/lsfg-vk-android
          expected="$(git rev-parse HEAD:${native_dir})"
          actual="$(git -C "$native_dir" rev-parse HEAD)"
          test "$actual" = "$expected"
          test "$expected" = "$B14_NATIVE_REVISION"
          printf '%s\n' "$expected" > /tmp/b14-native-commit
          echo "Pinned B14 native revision: $expected"

      - name: Prepare and validate arm64 B14 runtime
        uses: ./.github/actions/prepare-lsfg-native
        env:
          LSFGVK_ADAPTIVE_RUNTIME: "1"
          LSFGVK_B12_DUAL_STAGE_PROFILE: "1"
          LSFGVK_MIPMAPS_CANDIDATE_SCRIPT: scripts/apply-candidate-b14-mipmaps-tail-fusion.py

      - name: Verify transformed B12 control flow and strict B14 gate
        shell: bash
        run: |
          set -euo pipefail
          native_dir=app/src/main/cpp/lsfg-vk-android
          for context in \
            "$native_dir/framegen/v3.1_src/context.cpp" \
            "$native_dir/framegen/v3.1p_src/context.cpp"; do
            grep -Fq 'b12-stage-profile-init' "$context"
            grep -Fq 'b12-readback-pending stage=mipmaps' "$context"
            grep -Fq 'b12-readback-failure stage=mipmaps' "$context"
            grep -Fq 'result == VK_NOT_READY' "$context"
            grep -Fq '&& !data.b12MipmapsPending' "$context"
            grep -Fq '&& !data.b12Beta4Pending' "$context"
            grep -Fq 'std::cerr << "lsfg-vk: b12-stage-profile-init' "$context"
          done
          timestamp_source="$native_dir/framegen/src/core/timestampquerypool.cpp"
          if grep -Fq 'VK_QUERY_RESULT_WAIT_BIT' "$timestamp_source"; then
            echo 'ERROR: B12 readback still blocks in the frame hot path' >&2
            exit 1
          fi
          gate="$native_dir/scripts/b14_subgroup_properties.hpp"
          grep -Fq 'VK_SHADER_STAGE_COMPUTE_BIT' "$gate"
          grep -Fq 'VK_SUBGROUP_FEATURE_BASIC_BIT' "$gate"
          grep -Fq 'VK_SUBGROUP_FEATURE_BALLOT_BIT' "$gate"

      - name: Verify arm64 B14 runtime markers
        shell: bash
        run: |
          set -euo pipefail
          layer=app/src/main/jniLibs/arm64-v8a/liblsfg-vk-layer.so
          test -s "$layer"
          strings "$layer" > /tmp/b14-arm64.strings
          for marker in \
            'candidate-b11-beta4-pow2-mask' \
            'candidate-b13-beta4-fused-mask' \
            'candidate-b14-mipmaps-tail-fusion' \
            'b12-stage-profile-init' \
            'b12-readback-pending stage=mipmaps result=' \
            'b12-readback-failure stage=mipmaps result=' \
            'b12-readback-failure stage=beta4 result=' \
            'b12-stage-profile' \
            'mipmaps_attempts=' \
            'mipmaps_failures=' \
            'mipmaps_not_ready=' \
            'mipmaps_avg_ms=' \
            'beta4_attempts=' \
            'beta4_failures=' \
            'beta4_not_ready=' \
            'beta4_avg_ms=' \
            'b12-timestamp-capability' \
            'b12-timestamp-fallback' \
            'b12-device-profile'; do
            grep -Fq "$marker" /tmp/b14-arm64.strings || { echo "Missing B14 marker: $marker" >&2; exit 1; }
          done
          arm64_sha="$(sha256sum "$layer" | awk '{print $1}')"
          printf '%s\n' "$arm64_sha" > /tmp/b14-arm64-sha
          echo "Arm64 LSFG SHA-256: $arm64_sha"

      - name: Reset pinned native checkout before x86_64 validation
        shell: bash
        run: |
          set -euo pipefail
          native_dir=app/src/main/cpp/lsfg-vk-android
          expected="$(cat /tmp/b14-native-commit)"
          git -C "$native_dir" reset --hard "$expected"
          git -C "$native_dir" clean -ffdqx
          test "$(git -C "$native_dir" rev-parse HEAD)" = "$expected"
          test -z "$(git -C "$native_dir" status --porcelain)"

      - name: Build and validate x86_64 B14 runtime
        shell: bash
        env:
          ANDROID_ABI: x86_64
          ANDROID_NDK_VERSION: '27.3.13750724'
          LSFGVK_ADAPTIVE_RUNTIME: "1"
          LSFGVK_B12_DUAL_STAGE_PROFILE: "1"
          LSFGVK_MIPMAPS_CANDIDATE_SCRIPT: scripts/apply-candidate-b14-mipmaps-tail-fusion.py
        run: |
          set -euo pipefail
          native_dir=app/src/main/cpp/lsfg-vk-android
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          export ANDROID_NDK="$sdk_root/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="$ANDROID_NDK"
          export HOST_TAG=linux-x86_64
          (cd "$native_dir" && bash ./scripts/build/android.sh Release)
          built="$native_dir/build-android-x86_64/dist/liblsfg-vk-x86_64.so"
          test -s "$built"
          file "$built" | tee /tmp/b14-x86.file
          grep -Eq 'x86-64|x86_64' /tmp/b14-x86.file
          strings "$built" > /tmp/b14-x86.strings
          for marker in \
            'candidate-b14-mipmaps-tail-fusion' \
            'b12-stage-profile-init' \
            'b12-readback-pending stage=mipmaps result=' \
            'b12-readback-failure stage=mipmaps result=' \
            'b12-readback-failure stage=beta4 result=' \
            'mipmaps_avg_ms=' \
            'beta4_avg_ms='; do
            grep -Fq "$marker" /tmp/b14-x86.strings || { echo "Missing x86_64 profiler marker: $marker" >&2; exit 1; }
          done
          sha256sum "$built"

      - name: Inject debug credentials
        shell: bash
        run: |
          printf 'POSTHOG_API_KEY=dummy\n' > local.properties
          printf 'POSTHOG_HOST=https://us.i.posthog.com\n' >> local.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Legacy unit tests
        run: ./gradlew :app:testLegacyDebugUnitTest --no-daemon

      - name: Assemble B14 LegacyDebug APK
        run: ./gradlew :app:assembleLegacyDebug --no-daemon

      - name: Verify APK contains B14 runtime and fixed wrapper
        shell: bash
        run: |
          set -euo pipefail
          fixed=1b74eeb77ce522ff741f39152db05d8f777f4180babe59b4911a08d74b91d89c
          poisoned=2aecf1c11cde57008a3cc5e1a551e095d7843d3aa84b3756953afc134035e7c5
          mapfile -t apks < <(find app/build/outputs/apk/legacy/debug -maxdepth 1 -type f -name '*.apk' -print)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          unzip -l "$apk" | tee /tmp/apk-list.txt
          grep -Fq 'lib/arm64-v8a/liblsfg-vk-layer.so' /tmp/apk-list.txt
          wrapper_entry="$(awk '{print $4}' /tmp/apk-list.txt | grep -E '(^|/)wrapper-gamenative\.tzst$' | head -n1)"
          test -n "$wrapper_entry"
          tmp="$(mktemp -d)"
          unzip -p "$apk" "$wrapper_entry" > "$tmp/wrapper-gamenative.tzst"
          mkdir "$tmp/unpacked"
          tar --zstd -xf "$tmp/wrapper-gamenative.tzst" -C "$tmp/unpacked"
          mapfile -t wrappers < <(find "$tmp/unpacked" -type f -name libvulkan_wrapper.so -print)
          test "${#wrappers[@]}" -eq 1
          wrapper_sha="$(sha256sum "${wrappers[0]}" | awk '{print $1}')"
          echo "APK embedded wrapper SHA-256: $wrapper_sha"
          test "$wrapper_sha" != "$poisoned"
          test "$wrapper_sha" = "$fixed"
          unzip -p "$apk" lib/arm64-v8a/liblsfg-vk-layer.so > "$tmp/liblsfg-vk-layer.so"
          strings "$tmp/liblsfg-vk-layer.so" > "$tmp/apk-lsfg.strings"
          for marker in \
            'candidate-b14-mipmaps-tail-fusion' \
            'b12-stage-profile-init' \
            'b12-readback-pending stage=mipmaps result=' \
            'b12-readback-failure stage=mipmaps result=' \
            'b12-readback-failure stage=beta4 result=' \
            'b12-stage-profile' \
            'mipmaps_attempts=' \
            'mipmaps_failures=' \
            'mipmaps_not_ready=' \
            'mipmaps_avg_ms=' \
            'beta4_attempts=' \
            'beta4_failures=' \
            'beta4_not_ready=' \
            'beta4_avg_ms=' \
            'b12-device-profile' \
            'b12-timestamp-capability'; do
            grep -Fq "$marker" "$tmp/apk-lsfg.strings" || { echo "Missing packaged profiler marker: $marker" >&2; exit 1; }
          done
          packaged_lsfg_sha="$(sha256sum "$tmp/liblsfg-vk-layer.so" | awk '{print $1}')"
          expected_lsfg_sha="$(cat /tmp/b14-arm64-sha)"
          echo "Packaged LSFG SHA-256: $packaged_lsfg_sha"
          test "$packaged_lsfg_sha" = "$expected_lsfg_sha"
          cp "$apk" gamenative-adreno-b14-profiler-evidence.apk
          apk_sha="$(sha256sum gamenative-adreno-b14-profiler-evidence.apk | awk '{print $1}')"
          echo "Evidence APK SHA-256: $apk_sha"

      - name: Upload verified B14 profiler evidence APK
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-adreno-b14-profiler-evidence
          path: gamenative-adreno-b14-profiler-evidence.apk
          if-no-files-found: error
          compression-level: 0
