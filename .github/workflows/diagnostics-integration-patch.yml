name: Apply LSFG diagnostics integration patch

on:
  push:
    branches:
      - Adaptive-Frame-Generation
    paths:
      - .github/workflows/diagnostics-integration-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Adaptive-Frame-Generation
          fetch-depth: 0

      - name: Apply diagnostics lifecycle and UI integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          power = Path('app/src/main/java/app/gamenative/powercontrol/PowerManager.kt')
          text = power.read_text()
          old = 'import app.gamenative.PluviaApp\n'
          new = old + 'import app.gamenative.diagnostics.LsfgDiagnosticSession\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''    fun autoStart(rootDir: File) {
              containerDir = rootDir
              resolveGameAffinityOwnership()
          '''
          new = '''    fun autoStart(rootDir: File) {
              containerDir = rootDir
              val diagnosticSessionStart = System.currentTimeMillis()
              LsfgDiagnosticSession.start(appContext, rootDir, diagnosticSessionStart)
              resolveGameAffinityOwnership()
          '''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '        appContext.let { PerformanceMetricsCollector.start(it) }\n'
          new = '        appContext.let { PerformanceMetricsCollector.start(it, diagnosticSessionStart) }\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        AdaptiveFpsCapController.stop()
              PerformanceMetricsCollector.stop()
              stopPowerControl()
          '''
          new = '''        AdaptiveFpsCapController.stop()
              PerformanceMetricsCollector.stop()
              LsfgDiagnosticSession.stop()
              stopPowerControl()
          '''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          power.write_text(text)

          settings = Path('app/src/main/java/app/gamenative/ui/screen/settings/SettingsGroupDebug.kt')
          text = settings.read_text()
          old = 'import androidx.compose.runtime.remember\n'
          new = old + 'import androidx.compose.runtime.rememberCoroutineScope\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = 'import app.gamenative.CrashHandler\n'
          new = old + 'import app.gamenative.diagnostics.LsfgDiagnosticExporter\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = 'import kotlinx.coroutines.withContext\n'
          new = old + 'import kotlinx.coroutines.launch\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''    val context = LocalContext.current
              val isPreview = LocalInspectionMode.current
          '''
          new = '''    val context = LocalContext.current
              val diagnosticsScope = rememberCoroutineScope()
              val isPreview = LocalInspectionMode.current
          '''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          marker = '''    if (showLogcatDialog && latestCrashFile != null) {
          '''
          launcher = '''    /* Unified LSFG diagnostics export. Report assembly and logcat snapshots are export-time only. */
              val saveLsfgDiagnostics = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.CreateDocument("text/plain"),
              ) { resultUri ->
                  resultUri ?: return@rememberLauncherForActivityResult
                  diagnosticsScope.launch {
                      val result = withContext(Dispatchers.IO) {
                          runCatching {
                              val report = LsfgDiagnosticExporter.buildReport(context)
                              context.contentResolver.openOutputStream(resultUri)?.use { output ->
                                  output.write(report.toByteArray(Charsets.UTF_8))
                              } ?: error("Unable to open selected destination")
                          }
                      }
                      result.onSuccess {
                          SnackbarManager.show("LSFG diagnostics exported")
                      }.onFailure {
                          SnackbarManager.show("Failed to export LSFG diagnostics: ${it.message ?: it.javaClass.simpleName}")
                      }
                  }
              }

          '''
          assert text.count(marker) == 1
          text = text.replace(marker, launcher + marker, 1)

          marker = '''        // Link to open channel selector
          '''
          menu = '''        SettingsMenuLink(
                  colors = settingsTileColors(),
                  title = { Text(text = "Export LSFG Diagnostics") },
                  subtitle = { Text(text = "Export the latest rolling LSFG, frame pacing, Vulkan, wrapper, and app diagnostics") },
                  onClick = { saveLsfgDiagnostics.launch(LsfgDiagnosticExporter.defaultFileName()) },
              )
          '''
          assert text.count(marker) == 1
          text = text.replace(marker, menu + marker, 1)
          settings.write_text(text)
          PY

      - name: Commit integration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/app/gamenative/powercontrol/PowerManager.kt \
                  app/src/main/java/app/gamenative/ui/screen/settings/SettingsGroupDebug.kt
          git diff --cached --check
          git commit -m "feat(lsfg): wire unified diagnostics exporter"
          git push origin HEAD:Adaptive-Frame-Generation
