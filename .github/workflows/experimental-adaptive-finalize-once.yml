name: Finalize Experimental Adaptive Manager

on:
  push:
    branches:
      - experimental/winnative-governor-20260909
    paths:
      - .github/workflows/experimental-adaptive-finalize-once.yml

permissions:
  contents: write

jobs:
  finalize-manager:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v5
        with:
          ref: experimental/winnative-governor-20260909
          fetch-depth: 0

      - name: Isolate Adaptive output target from source FPS limiter
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manager = Path("app/src/main/java/app/gamenative/utils/LsfgVkManager.kt")
          text = manager.read_text(encoding="utf-8")

          def replace_once(before: str, after: str) -> None:
              global text
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"expected exactly one manager anchor, found {count}: {before[:80]!r}")
              text = text.replace(before, after, 1)

          replace_once(
              '''    // FPS limiter extras (owned by XServerScreen)\n    private const val EXTRA_FPS_LIMITER_ENABLED = "fpsLimiterEnabled"\n    private const val EXTRA_FPS_LIMITER_TARGET = "fpsLimiterTarget"\n\n''',
              '''    // GameNative owns real/source-frame pacing. conf.toml must stay\n    // uncapped; Adaptive output targeting is supplied only by the separate\n    // gamenative-adaptive.toml overlay consumed by the native layer.\n    private const val LSFG_CONF_FPS_LIMIT = 0\n\n''',
          )
          replace_once(
              '''    /**\n     * Base fps cap for the layer's limiter (0 = uncapped). The layer\n     * phase-locks its schedule to the vsync grid published by\n     * [startVsyncClock]; without that file it falls back to free-running.\n     */\n    fun fpsLimit(container: Container): Int {\n        if (!parseBool(container.getExtra(EXTRA_FPS_LIMITER_ENABLED, "false"))) return 0\n        return container.getExtra(EXTRA_FPS_LIMITER_TARGET, "0").toIntOrNull()?.coerceAtLeast(0) ?: 0\n    }\n\n''',
              '',
          )
          replace_once(
              '                fpsLimit = fpsLimit(container),\n',
              '                fpsLimit = LSFG_CONF_FPS_LIMIT,\n',
          )
          replace_once(
              '''    /**\n     * Update conf.toml while the container is running. The layer observes the\n     * timestamp change and recreates its swapchain context with the new values.\n     * A temporary fpsLimitOverride is deliberately not persisted in container\n     * extras, so adaptive caps can be applied without rewriting user settings.\n     */\n''',
              '''    /**\n     * Update conf.toml while the container is running. The layer observes the\n     * timestamp change and recreates its swapchain context with the new values.\n     * GameNative's real/source FPS limiter is intentionally not forwarded here;\n     * Adaptive output targeting lives exclusively in gamenative-adaptive.toml.\n     */\n''',
          )
          replace_once(
              '''        flowScale: Float,\n        performanceMode: Boolean,\n        fpsLimitOverride: Int? = null,\n    ): Boolean {\n''',
              '''        flowScale: Float,\n        performanceMode: Boolean,\n    ): Boolean {\n''',
          )
          replace_once(
              '            val effectiveFpsLimit = (fpsLimitOverride ?: fpsLimit(container)).coerceAtLeast(0)\n',
              '            val effectiveFpsLimit = LSFG_CONF_FPS_LIMIT\n',
          )

          manager.write_text(text, encoding="utf-8")
          PY

      - name: Verify manager isolation
        shell: bash
        run: |
          set -euo pipefail
          manager=app/src/main/java/app/gamenative/utils/LsfgVkManager.kt
          grep -Fq 'LSFG_CONF_FPS_LIMIT = 0' "$manager"
          grep -Fq 'fpsLimit = LSFG_CONF_FPS_LIMIT' "$manager"
          ! grep -Fq 'EXTRA_FPS_LIMITER_ENABLED' "$manager"
          ! grep -Fq 'EXTRA_FPS_LIMITER_TARGET' "$manager"
          ! grep -Fq 'fpsLimitOverride' "$manager"
          git diff --check -- "$manager"

      - name: Commit manager isolation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/gamenative/utils/LsfgVkManager.kt
          git diff --cached --check
          git commit -m "fix(lsfg): isolate Adaptive output target"
          git push origin HEAD:experimental/winnative-governor-20260909
