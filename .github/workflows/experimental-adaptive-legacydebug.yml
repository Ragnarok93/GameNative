name: Experimental Adaptive LSFG LegacyDebug

on:
  workflow_dispatch:
  push:
    branches:
      - experimental/adaptive-ui-cadence-stage-20260911
    paths:
      - app/src/main/cpp/lsfg-vk-android
      - app/src/main/java/app/gamenative/ui/component/QuickMenu.kt
      - app/src/main/java/app/gamenative/ui/component/LsfgAdaptiveTargetUtils.kt
      - app/src/main/java/app/gamenative/utils/LsfgQuickMenuHelper.kt
      - app/src/main/java/app/gamenative/utils/LsfgVkManager.kt
      - app/src/test/java/app/gamenative/ui/component/LsfgAdaptiveTargetUtilsTest.kt
      - app/src/main/res/values/strings_lsfg_adaptive.xml
      - .github/actions/prepare-lsfg-native/action.yml
      - .github/workflows/experimental-adaptive-legacydebug.yml

jobs:
  adaptive-legacy-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify pinned LSFG native revision
        shell: bash
        run: |
          set -euo pipefail
          native_dir=app/src/main/cpp/lsfg-vk-android
          expected_native=b77b8e81f260f3bcace6000d011c79b2c222b9ac
          actual_native="$(git rev-parse HEAD:${native_dir})"
          test "$actual_native" = "$expected_native"
          git submodule update --init --recursive -- "$native_dir"
          test "$(git -C "$native_dir" rev-parse HEAD)" = "$expected_native"
          git diff --check

      - name: Prepare GameNative-pinned LSFG native runtime
        uses: ./.github/actions/prepare-lsfg-native

      - name: Inject debug credentials
        run: |
          printf 'POSTHOG_API_KEY=dummy\n' > local.properties
          printf 'POSTHOG_HOST=https://us.i.posthog.com\n' >> local.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Legacy unit tests
        run: ./gradlew :app:testLegacyDebugUnitTest --no-daemon

      - name: Assemble Adaptive LegacyDebug
        run: ./gradlew :app:assembleLegacyDebug --no-daemon

      - name: Prepare Adaptive LegacyDebug APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/legacy/debug -maxdepth 1 -type f -name '*.apk' -print)
          test ${#apks[@]} -eq 1
          cp "${apks[0]}" gamenative-adaptive-legacy-debug.apk
          sha256sum gamenative-adaptive-legacy-debug.apk
          ls -lh gamenative-adaptive-legacy-debug.apk

      - name: Upload Adaptive LegacyDebug APK
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-adaptive-legacy-debug
          path: gamenative-adaptive-legacy-debug.apk
          if-no-files-found: error
          compression-level: 0
