name: Experimental Adaptive LSFG LegacyDebug

on:
  workflow_dispatch:
  push:
    branches:
      - experimental/winnative-governor-20260909
    paths:
      - app/src/main/cpp/lsfg-vk-android
      - app/src/main/java/app/gamenative/ui/component/QuickMenu.kt
      - app/src/main/java/app/gamenative/utils/LsfgQuickMenuHelper.kt
      - app/src/main/java/app/gamenative/utils/LsfgVkManager.kt
      - app/src/main/res/values/strings_lsfg_adaptive.xml
      - .github/actions/prepare-lsfg-native/action.yml
      - .github/workflows/experimental-adaptive-legacydebug.yml

jobs:
  adaptive-legacy-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Adaptive integration contracts
        shell: bash
        run: |
          set -euo pipefail
          native_dir=app/src/main/cpp/lsfg-vk-android
          expected_native=01831cca792a32a245df8240a7fe5d7df64f7e75
          actual_native="$(git rev-parse HEAD:${native_dir})"
          test "$actual_native" = "$expected_native"
          git submodule update --init --recursive -- "$native_dir"
          test "$(git -C "$native_dir" rev-parse HEAD)" = "$expected_native"

          python3 - "$native_dir/tests/gamenative_adaptive_config_test.py" <<'PY'
          import runpy
          import sys

          namespace = runpy.run_path(sys.argv[1])
          tests = sorted(
              (name, value)
              for name, value in namespace.items()
              if name.startswith("test_") and callable(value)
          )
          if not tests:
              raise SystemExit("no GameNative Adaptive native contract tests found")
          for name, test in tests:
              print(f"running {name}")
              test()
          PY

          python3 - <<'PY'
          from pathlib import Path

          helper = Path('app/src/main/java/app/gamenative/utils/LsfgQuickMenuHelper.kt').read_text(encoding='utf-8')
          manager = Path('app/src/main/java/app/gamenative/utils/LsfgVkManager.kt').read_text(encoding='utf-8')
          quick = Path('app/src/main/java/app/gamenative/ui/component/QuickMenu.kt').read_text(encoding='utf-8')
          native = Path('app/src/main/cpp/lsfg-vk-android/src/context.cpp').read_text(encoding='utf-8')

          assert 'gamenative-adaptive.toml' in helper
          assert 'intArrayOf(60, 90, 120, 144)' in helper
          assert 'fpsLimitOverride' not in helper
          assert 'LSFG_CONF_FPS_LIMIT = 0' in manager
          assert 'EXTRA_FPS_LIMITER_ENABLED' not in manager
          assert 'EXTRA_FPS_LIMITER_TARGET' not in manager
          assert 'fpsLimitOverride' not in manager
          assert 'fpsLimit = LSFG_CONF_FPS_LIMIT' in manager
          assert 'LsfgQuickMenuHelper.applyAdaptiveSettings' in quick
          assert 'lsfg_adaptive_framegen' in quick
          assert 'lsfg_adaptive_target' in quick
          assert 'adaptive_source_fps' in native
          assert 'adaptive_smoothed_source_fps' in native
          assert 'adaptive_cost_limit' in native
          assert 'adaptive_final_generated' in native
          assert 'adaptive_zero_cycles' in native
          PY

          git diff --check

      - name: Prepare GameNative-pinned LSFG native runtime
        uses: ./.github/actions/prepare-lsfg-native

      - name: Inject debug credentials
        run: |
          printf 'POSTHOG_API_KEY=dummy\n' > local.properties
          printf 'POSTHOG_HOST=https://us.i.posthog.com\n' >> local.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble Adaptive LegacyDebug
        run: ./gradlew :app:assembleLegacyDebug --no-daemon

      - name: Prepare Adaptive LegacyDebug APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/legacy/debug -maxdepth 1 -type f -name '*.apk' -print)
          test ${#apks[@]} -eq 1
          cp "${apks[0]}" gamenative-adaptive-legacy-debug.apk
          sha256sum gamenative-adaptive-legacy-debug.apk
          ls -lh gamenative-adaptive-legacy-debug.apk

      - name: Upload Adaptive LegacyDebug APK
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-adaptive-legacy-debug
          path: gamenative-adaptive-legacy-debug.apk
          if-no-files-found: error
          compression-level: 0
