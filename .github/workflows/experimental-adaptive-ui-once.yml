name: Experimental Adaptive UI patch

on:
  push:
    branches:
      - experimental/winnative-governor-20260909
    paths:
      - .github/workflows/experimental-adaptive-ui-once.yml

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: experimental/winnative-governor-20260909
          fetch-depth: 0

      - name: Apply narrow Quick Menu patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/app/gamenative/ui/component/QuickMenu.kt")
          text = path.read_text(encoding="utf-8")

          replacements = []
          replacements.append((
              """                                        LsfgQuickMenuTab(\n                                            multiplier = lsfgMultiplier,\n""",
              """                                        LsfgQuickMenuTab(\n                                            container = container,\n                                            multiplier = lsfgMultiplier,\n""",
          ))
          replacements.append((
              """private fun LsfgQuickMenuTab(\n    multiplier: Int,\n""",
              """private fun LsfgQuickMenuTab(\n    container: com.winlator.container.Container?,\n    multiplier: Int,\n""",
          ))
          replacements.append((
              """    val accentColor = PluviaTheme.colors.accentPurple\n    val isEnabled = multiplier >= 2\n\n    Column(\n""",
              """    val accentColor = PluviaTheme.colors.accentPurple\n    val isEnabled = multiplier >= 2\n    val initialAdaptiveSettings = remember(container) {\n        container?.let { app.gamenative.utils.LsfgQuickMenuHelper.readSettings(it) }\n    }\n    var adaptiveFramegen by remember(container) {\n        mutableStateOf(initialAdaptiveSettings?.adaptiveFramegen == true)\n    }\n    var adaptiveTargetFps by remember(container) {\n        mutableStateOf(initialAdaptiveSettings?.adaptiveTargetFps ?: 60)\n    }\n\n    Column(\n""",
          ))
          replacements.append((
              """                Spacer(modifier = Modifier.height(4.dp))\n\n                // ── Flow Scale ────────────────────────────────────────────\n""",
              """                Spacer(modifier = Modifier.height(4.dp))\n\n                // ── Adaptive frame generation ─────────────────────────────\n                QuickMenuToggleRow(\n                    title = stringResource(R.string.lsfg_adaptive_framegen),\n                    subtitle = stringResource(R.string.lsfg_adaptive_framegen_desc),\n                    enabled = adaptiveFramegen,\n                    onToggle = {\n                        val next = !adaptiveFramegen\n                        adaptiveFramegen = next\n                        container?.let {\n                            app.gamenative.utils.LsfgQuickMenuHelper.applyAdaptiveSettings(\n                                it,\n                                next,\n                                adaptiveTargetFps,\n                            )\n                        }\n                    },\n                    accentColor = accentColor,\n                )\n\n                if (adaptiveFramegen) {\n                    Spacer(modifier = Modifier.height(4.dp))\n                    QuickMenuSectionHeader(\n                        title = stringResource(R.string.lsfg_adaptive_target),\n                        subtitle = stringResource(R.string.lsfg_adaptive_target_desc),\n                    )\n                    Row(\n                        modifier = Modifier.padding(horizontal = 8.dp),\n                        horizontalArrangement = Arrangement.spacedBy(8.dp),\n                    ) {\n                        app.gamenative.utils.LsfgQuickMenuHelper.ADAPTIVE_TARGET_OPTIONS.forEach { target ->\n                            QuickMenuChoiceChip(\n                                text = target.toString(),\n                                selected = adaptiveTargetFps == target,\n                                accentColor = accentColor,\n                                onClick = {\n                                    adaptiveTargetFps = target\n                                    container?.let {\n                                        app.gamenative.utils.LsfgQuickMenuHelper.applyAdaptiveSettings(\n                                            it,\n                                            true,\n                                            target,\n                                        )\n                                    }\n                                },\n                                modifier = Modifier.width(56.dp),\n                            )\n                        }\n                    }\n                }\n\n                Spacer(modifier = Modifier.height(4.dp))\n\n                // ── Flow Scale ────────────────────────────────────────────\n""",
          ))

          for before, after in replacements:
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"expected exactly one QuickMenu anchor, found {count}")
              text = text.replace(before, after, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/experimental-adaptive-ui-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/gamenative/ui/component/QuickMenu.kt .github/workflows/experimental-adaptive-ui-once.yml
          git diff --cached --check
          git commit -m "feat(lsfg): expose Adaptive target controls"
          git push origin HEAD:experimental/winnative-governor-20260909
