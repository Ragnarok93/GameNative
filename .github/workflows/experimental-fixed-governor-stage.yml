name: Validate fixed governor GameNative integration

on:
  push:
    branches:
      - experimental/winnative-gamenative-cleanup-stage

permissions:
  contents: write

jobs:
  legacy-debug:
    if: github.event.head_commit.message != 'perf(lsfg): integrate fixed governor runtime'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GameNative
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Audit removed integration entrypoints
        shell: bash
        run: |
          set -euo pipefail
          git grep -n -E 'startVsyncClock|stopVsyncClock|fpsLimitOverride' -- ':!app/src/main/java/app/gamenative/utils/LsfgVkManager.kt' || true

      - name: Apply fixed-governor integration and pin native runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_fixed_governor_gamenative.py
          git -C app/src/main/cpp/lsfg-vk-android fetch origin eca8f7a39e0778ad725144ec6c0a884012019121
          git -C app/src/main/cpp/lsfg-vk-android checkout --detach eca8f7a39e0778ad725144ec6c0a884012019121
          test "$(git -C app/src/main/cpp/lsfg-vk-android rev-parse HEAD)" = "eca8f7a39e0778ad725144ec6c0a884012019121"
          if git grep -n -E 'gamenative-adaptive|adaptive_framegen|target_output_fps|fps_limit|fpsLimitOverride' -- app/src/main/java/app/gamenative app/src/main/res; then
            echo 'Vestigial LSFG Adaptive/FPS-target integration remains' >&2
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare GameNative-pinned LSFG native runtime
        uses: ./.github/actions/prepare-lsfg-native

      - name: Inject credentials
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          printf 'POSTHOG_API_KEY=%s\n' "${POSTHOG_API_KEY:-dummy}" > local.properties
          printf 'POSTHOG_HOST=%s\n' "${POSTHOG_HOST:-https://us.i.posthog.com}" >> local.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble LegacyDebug
        run: ./gradlew :app:assembleLegacyDebug --no-daemon

      - name: Commit validated integration on staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ragnarok93"
          git config user.email "e_fontenot1@yahoo.com"
          git add app/src/main/java/app/gamenative/utils/LsfgVkManager.kt app/src/main/cpp/lsfg-vk-android
          git diff --cached --check
          git commit -m 'perf(lsfg): integrate fixed governor runtime'
          git push origin HEAD:experimental/winnative-gamenative-cleanup-stage
