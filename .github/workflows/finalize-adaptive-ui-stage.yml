name: Finalize Adaptive UI stage

on:
  workflow_dispatch:
  push:
    branches:
      - experimental/adaptive-ui-cadence-stage-20260911
    paths:
      - tools/finalize_adaptive_ui_stage.py
      - app/src/test/java/app/gamenative/utils/LsfgVkManagerTest.kt
      - .github/actions/prepare-lsfg-native/action.yml
      - .github/workflows/finalize-adaptive-ui-stage.yml

permissions:
  contents: write

jobs:
  finalize-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[adaptive-ui-final]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stage
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply and locally commit Adaptive UI/runtime patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/finalize_adaptive_ui_stage.py
          native_sha=f7158459cc689c05c5fbfa721301d9a8586537f0
          native_dir=app/src/main/cpp/lsfg-vk-android

          git update-index --cacheinfo 160000,"$native_sha","$native_dir"
          git submodule update --init --recursive -- "$native_dir"
          test "$(git -C "$native_dir" rev-parse HEAD)" = "$native_sha"

          grep -q 'MAX_ADAPTIVE_TARGET_FPS = 120' app/src/main/java/app/gamenative/utils/LsfgVkManager.kt
          ! grep -q 'MAX_ADAPTIVE_TARGET_FPS = 144' app/src/main/java/app/gamenative/utils/LsfgVkManager.kt
          ! grep -q 'Slider(' app/src/main/java/app/gamenative/ui/component/QuickMenu.kt
          grep -q 'QuickMenuAdjustmentRow(' app/src/main/java/app/gamenative/ui/component/QuickMenu.kt
          grep -q 'nextAdaptiveTargetFps' app/src/main/java/app/gamenative/ui/component/QuickMenu.kt
          grep -q 'previousAdaptiveTargetFps' app/src/main/java/app/gamenative/ui/component/QuickMenu.kt

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/cpp/lsfg-vk-android \
                  app/src/main/java/app/gamenative/ui/component/QuickMenu.kt \
                  app/src/main/java/app/gamenative/ui/component/LsfgAdaptiveTargetUtils.kt \
                  app/src/main/java/app/gamenative/utils/LsfgQuickMenuHelper.kt \
                  app/src/main/java/app/gamenative/utils/LsfgVkManager.kt \
                  app/src/test/java/app/gamenative/ui/component/LsfgAdaptiveTargetUtilsTest.kt \
                  app/src/test/java/app/gamenative/utils/LsfgQuickMenuHelperModeTest.kt \
                  .github/workflows/experimental-adaptive-legacydebug.yml
          git diff --cached --check
          git commit -m 'feat(lsfg): finalize adaptive target controls [adaptive-ui-final]'
          test "$(git rev-parse HEAD:$native_dir)" = "$native_sha"
          test "$(git -C "$native_dir" rev-parse HEAD)" = "$native_sha"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare pinned LSFG native runtime
        uses: ./.github/actions/prepare-lsfg-native

      - name: Inject debug credentials
        shell: bash
        run: |
          printf 'POSTHOG_API_KEY=dummy\n' > local.properties
          printf 'POSTHOG_HOST=https://us.i.posthog.com\n' >> local.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run adaptive target unit tests
        run: ./gradlew :app:testLegacyDebugUnitTest --tests 'app.gamenative.ui.component.LsfgAdaptiveTargetUtilsTest' --no-daemon

      - name: Run Legacy unit tests
        run: ./gradlew :app:testLegacyDebugUnitTest --no-daemon

      - name: Print Legacy unit test failures
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          results_dir=app/build/test-results/testLegacyDebugUnitTest
          if [[ ! -d "$results_dir" ]]; then
            echo "No Legacy JUnit result directory was produced."
            exit 0
          fi
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path("app/build/test-results/testLegacyDebugUnitTest")
          found = False
          for report in sorted(root.rglob("*.xml")):
              try:
                  suite = ET.parse(report).getroot()
              except ET.ParseError as exc:
                  print(f"Could not parse {report}: {exc}")
                  continue
              for case in suite.iter("testcase"):
                  problem = case.find("failure")
                  if problem is None:
                      problem = case.find("error")
                  if problem is None:
                      continue
                  found = True
                  classname = case.attrib.get("classname", "")
                  name = case.attrib.get("name", "")
                  message = problem.attrib.get("message", "")
                  body = (problem.text or "").strip()
                  print(f"::error title=Legacy unit test failed::{classname}.{name}: {message}")
                  print(f"REPORT: {report}")
                  if body:
                      print(body)
          if not found:
              print("No <failure> or <error> entries found in Legacy JUnit XML.")
          PY

      - name: Upload Legacy unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-unit-test-reports
          path: |
            app/build/test-results/testLegacyDebugUnitTest/**
            app/build/reports/tests/testLegacyDebugUnitTest/**
          if-no-files-found: warn

      - name: Build LegacyDebug
        run: ./gradlew :app:assembleLegacyDebug --no-daemon

      - name: Push verified product commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:experimental/adaptive-ui-cadence-stage-20260911

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/legacy/debug -maxdepth 1 -type f -name '*.apk' -print)
          test ${#apks[@]} -eq 1
          cp "${apks[0]}" gamenative-adaptive-cadence-legacy-debug.apk
          sha256sum gamenative-adaptive-cadence-legacy-debug.apk
          ls -lh gamenative-adaptive-cadence-legacy-debug.apk

      - name: Upload LegacyDebug APK
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-adaptive-cadence-legacy-debug
          path: gamenative-adaptive-cadence-legacy-debug.apk
          if-no-files-found: error
          compression-level: 0
