name: Fork Validation Build

on:
  workflow_dispatch:
  push:
    branches:
      - fix/lsfg-discovery-material-you

permissions:
  contents: read

concurrency:
  group: fork-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Legacy)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure non-production build values
        run: |
          cat <<'EOF' > local.properties
          POSTHOG_API_KEY=dummy
          POSTHOG_HOST=https://us.i.posthog.com
          STEAMGRIDDB_API_KEY=dummy
          CLOUD_PROJECT_NUMBER=dummy
          EOF

      - name: Run Legacy unit tests
        run: ./gradlew :app:testLegacyDebugUnitTest --stacktrace

      - name: Upload Legacy test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-Legacy-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/testLegacyDebugUnitTest/
            app/build/test-results/testLegacyDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

  build-legacy:
    name: Build legacy debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure non-production build values
        run: |
          cat <<'EOF' > local.properties
          POSTHOG_API_KEY=dummy
          POSTHOG_HOST=https://us.i.posthog.com
          STEAMGRIDDB_API_KEY=dummy
          CLOUD_PROJECT_NUMBER=dummy
          EOF

      - name: Assemble legacy debug APK
        run: ./gradlew :app:assembleLegacyDebug --stacktrace

      - name: Upload legacy debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-legacy-debug-${{ github.sha }}
          path: app/build/outputs/apk/legacy/debug/app-legacy-debug.apk
          if-no-files-found: error
          retention-days: 14
