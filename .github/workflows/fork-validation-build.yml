name: Fork Validation Build

on:
  workflow_dispatch:
  push:
    branches:
      - fix/lsfg-discovery-material-you

permissions:
  contents: read

concurrency:
  group: fork-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flavor: [Legacy, Modern]

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure non-production build values
        run: |
          cat <<'EOF' > local.properties
          POSTHOG_API_KEY=dummy
          POSTHOG_HOST=https://us.i.posthog.com
          STEAMGRIDDB_API_KEY=dummy
          CLOUD_PROJECT_NUMBER=dummy
          EOF

      - name: Run ${{ matrix.flavor }} unit tests
        run: ./gradlew :app:test${{ matrix.flavor }}DebugUnitTest --stacktrace

      - name: Upload ${{ matrix.flavor }} test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.flavor }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/test${{ matrix.flavor }}DebugUnitTest/
            app/build/test-results/test${{ matrix.flavor }}DebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

  build-modern:
    name: Build modern debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure non-production build values
        run: |
          cat <<'EOF' > local.properties
          POSTHOG_API_KEY=dummy
          POSTHOG_HOST=https://us.i.posthog.com
          STEAMGRIDDB_API_KEY=dummy
          CLOUD_PROJECT_NUMBER=dummy
          EOF

      - name: Assemble modern debug APK
        run: ./gradlew :app:assembleModernDebug --stacktrace

      - name: Upload modern debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-modern-debug-${{ github.sha }}
          path: app/build/outputs/apk/modern/debug/app-modern-debug.apk
          if-no-files-found: error
          retention-days: 14
