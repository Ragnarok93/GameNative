name: Hitch Fix LegacyDebug APK

on:
  push:
    branches:
      - ci/hitch-fix-legacydebug-20260905
  workflow_dispatch:

jobs:
  legacy-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GameNative
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare GameNative-pinned LSFG native runtime
        uses: ./.github/actions/prepare-lsfg-native

      - name: Replace packaged LSFG runtime with hitch fix
        shell: bash
        env:
          LSFG_HITCH_COMMIT: d55f364add8863f16ebf902bffe19129a12690db
          ANDROID_NDK_VERSION: 27.3.13750724
          ANDROID_ABI: arm64-v8a
          HOST_TAG: linux-x86_64
        run: |
          set -euo pipefail
          native_dir=app/src/main/cpp/lsfg-vk-android
          layer=app/src/main/jniLibs/arm64-v8a/liblsfg-vk-layer.so
          runtime_manager=app/src/main/java/app/gamenative/utils/LsfgVkManager.kt
          runtime_test=app/src/test/java/app/gamenative/utils/LsfgVkManagerTest.kt

          git -C "$native_dir" fetch origin "$LSFG_HITCH_COMMIT"
          git -C "$native_dir" checkout --detach "$LSFG_HITCH_COMMIT"
          actual_commit="$(git -C "$native_dir" rev-parse HEAD)"
          test "$actual_commit" = "$LSFG_HITCH_COMMIT"
          echo "Building hitch-fix LSFG revision $actual_commit"

          python3 "$native_dir/tests/android_present_io_contract_test.py"
          python3 "$native_dir/tests/android_ahb_portability_test.py"
          python3 "$native_dir/tests/android_wsi_loader_bridge_test.py"
          python3 "$native_dir/tests/android_wsi_provenance_test.py"
          python3 "$native_dir/tests/android_runtime_stability_test.py"
          python3 "$native_dir/tests/android_capability_architecture_test.py"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          export ANDROID_NDK_ROOT="${sdk_root}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK="$ANDROID_NDK_ROOT"
          (
            cd "$native_dir"
            bash ./scripts/build/android.sh Release
          )

          built="$native_dir/build-android-arm64-v8a/dist/liblsfg-vk-arm64-v8a.so"
          test -s "$built"
          cp "$built" "$layer"
          test -s "$layer"
          sha256sum "$layer"

          expected_prefix="${LSFG_HITCH_COMMIT:0:8}"
          python3 - "$runtime_manager" "$runtime_test" "$expected_prefix" <<'PY'
          import pathlib
          import re
          import sys

          manager = pathlib.Path(sys.argv[1])
          test = pathlib.Path(sys.argv[2])
          expected_prefix = sys.argv[3]

          manager_text = manager.read_text(encoding="utf-8")
          manager_text, manager_count = re.subn(
              r"(gamenative-[a-z0-9-]+-)[0-9a-f]{8}(-r[0-9]+)",
              rf"\g<1>{expected_prefix}\g<2>", manager_text, count=1
          )
          if manager_count != 1:
              raise SystemExit("ERROR: could not rewrite LSFG runtime marker")
          manager.write_text(manager_text, encoding="utf-8")

          test_text = test.read_text(encoding="utf-8")
          test_text, test_count = re.subn(
              r'(loaderVersion\.readText\(\)\.contains\(")[0-9a-f]{8}("\))',
              rf"\g<1>{expected_prefix}\g<2>", test_text, count=1
          )
          if test_count != 1:
              raise SystemExit("ERROR: could not rewrite LSFG provenance assertion")
          test.write_text(test_text, encoding="utf-8")
          PY

          grep -Fq "$expected_prefix" "$runtime_manager"
          grep -Fq "$expected_prefix" "$runtime_test"

      - name: Inject credentials
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          printf 'POSTHOG_API_KEY=%s\n' "${POSTHOG_API_KEY:-dummy}" > local.properties
          printf 'POSTHOG_HOST=%s\n' "${POSTHOG_HOST:-https://us.i.posthog.com}" >> local.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble LegacyDebug only
        run: ./gradlew :app:assembleLegacyDebug --no-daemon

      - name: Prepare single LegacyDebug APK
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/legacy/debug -maxdepth 1 -type f -name '*.apk' -print)
          test ${#apks[@]} -eq 1
          cp "${apks[0]}" gamenative-hitch-fix-legacy-debug.apk
          sha256sum gamenative-hitch-fix-legacy-debug.apk
          ls -lh gamenative-hitch-fix-legacy-debug.apk

      - name: Upload LegacyDebug APK
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-hitch-fix-legacy-debug
          path: gamenative-hitch-fix-legacy-debug.apk
          if-no-files-found: error
          compression-level: 0
