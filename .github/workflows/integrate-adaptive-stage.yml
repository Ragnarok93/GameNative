name: Validate Adaptive LSFG integration stage

on:
  push:
    branches:
      - experimental/winnative-governor-integration-stage-20260910
    paths:
      - tools/apply_gamenative_adaptive.py
      - .github/workflows/integrate-adaptive-stage.yml

permissions:
  contents: write

jobs:
  legacy-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged GameNative
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply deterministic integration
        env:
          LSFG_SHA: edcb5e25c7c9e23b3653fb7a90a580cc2b520b4f
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tools/apply_gamenative_adaptive.py")
          source = path.read_text(encoding="utf-8")
          start_marker = 'xserver = xserver.replace("            LsfgVkManager.stopVsyncClock()\\n", "")'
          end_marker = 'write(xserver_rel, xserver)'
          start = source.index(start_marker)
          end = source.index(end_marker, start) + len(end_marker)
          replacement = '''marker_start = "\\n    DisposableEffect(container, lsfgRuntimeMode) {"
          marker_end = "\\n    // Event handlers defined in composable scope"
          start = xserver.find(marker_start)
          end = xserver.find(marker_end, start)
          if start < 0 or end < 0:
              raise RuntimeError("unable to locate XServer LSFG vsync lifecycle block")
          xserver = xserver[:start] + "\\n" + xserver[end:]
          xserver = xserver.replace("            LsfgVkManager.stopVsyncClock()\\n", "")
          if "startVsyncClock" in xserver or "stopVsyncClock" in xserver:
              raise RuntimeError("XServer still references removed vsync publisher")
          write(xserver_rel, xserver)'''
          path.write_text(source[:start] + replacement + source[end:], encoding="utf-8")
          PY
          python3 tools/apply_gamenative_adaptive.py

      - name: Commit transformed product locally
        run: |
          git restore --source=HEAD -- .github/workflows/apply-lsfg-mode-cleanup.yml || true
          git restore --source=HEAD -- .github/workflows/experimental-adaptive-legacydebug.yml || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/app/gamenative/ui/component/QuickMenu.kt \
                  app/src/main/java/app/gamenative/ui/screen/xserver/XServerScreen.kt \
                  app/src/main/java/app/gamenative/utils/LsfgQuickMenuHelper.kt \
                  app/src/main/java/app/gamenative/utils/LsfgVkManager.kt \
                  app/src/main/res/values/strings_lsfg_adaptive.xml \
                  app/src/main/cpp/lsfg-vk-android
          git diff --cached --check
          git commit -m 'feat(lsfg): integrate authoritative Adaptive controls'
          test "$(git rev-parse HEAD:app/src/main/cpp/lsfg-vk-android)" = "edcb5e25c7c9e23b3653fb7a90a580cc2b520b4f"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare pinned LSFG native runtime
        uses: ./.github/actions/prepare-lsfg-native

      - name: Inject credentials
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          printf 'POSTHOG_API_KEY=%s\n' "${POSTHOG_API_KEY:-dummy}" > local.properties
          printf 'POSTHOG_HOST=%s\n' "${POSTHOG_HOST:-https://us.i.posthog.com}" >> local.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build LegacyDebug
        run: ./gradlew :app:assembleLegacyDebug --no-daemon

      - name: Push validated product commit to stage branch
        run: git push origin HEAD:experimental/winnative-governor-integration-stage-20260910

      - name: Upload LegacyDebug APK
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-adaptive-legacy-debug-stage
          path: app/build/outputs/apk/legacy/debug/*.apk
          if-no-files-found: error
          compression-level: 0
