name: Adreno 6xx LSFG Clean Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - feature/adreno-6xx-lsfg-optimization
      - fix/android-instance-dispatch-isolation
      - feature/adreno-6xx-candidate-b2-mipmaps
      - feature/adreno-6xx-candidate-b3-beta4-analysis
      - feature/adreno-6xx-candidate-b4-beta4-predicate
      - feature/adreno-6xx-candidate-b6-pipeline-exec-profile
      - feature/adreno-6xx-candidate-b8-mipmaps-matrix
      - feature/adreno-6xx-final-nonadaptive-sweep
      - feature/adreno-6xx-deferred-zero-b4
      - feature/adreno-6xx-clean-benchmark
    paths:
      - app/src/main/cpp/lsfg-vk-android
      - .github/actions/prepare-lsfg-native/**
      - .github/workflows/lsfg-legacy-single-apk.yml

concurrency:
  group: gamenative-adreno6xx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checking out GameNative
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Verify pinned clean Adreno LSFG native revision
        shell: bash
        run: |
          set -euo pipefail
          native_dir=app/src/main/cpp/lsfg-vk-android
          # Validated Candidate A DeferredZero + two-request wake persistence + B4.
          # Clean benchmark mode excludes zero-stage, generated-stage, B6/B8 and final-sweep profiling; B9/B10 remain disabled.
          expected_native=ed53505c87b8c02099c83f89c5bcef24bf5838ca
          actual_native="$(git rev-parse HEAD:${native_dir})"
          test "$actual_native" = "$expected_native"
          git submodule update --init --recursive -- "$native_dir"
          test "$(git -C "$native_dir" rev-parse HEAD)" = "$expected_native"
          git diff --check

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Prepare clean GameNative-pinned LSFG native runtime
        uses: ./.github/actions/prepare-lsfg-native
        env:
          LSFGVK_ADAPTIVE_RUNTIME: "1"

      - name: Verify packaged LSFG layer is benchmark-clean
        shell: bash
        run: |
          set -euo pipefail
          layer=app/src/main/assets/lsfg_vk/android_arm64_v8a/liblsfg-vk-layer.so
          test -f "$layer"
          strings "$layer" > /tmp/lsfg-layer-strings.txt
          grep -Fq 'deferred-zero reprime-warmup-begin' /tmp/lsfg-layer-strings.txt
          grep -Fq 'deferred-zero reprime-deferred request_count=' /tmp/lsfg-layer-strings.txt
          grep -Fq 'candidate-b4-beta4-predicate-opt' /tmp/lsfg-layer-strings.txt
          for forbidden in \
            'pipeline-exec-ir-line' \
            'generated-stage-profile backend=' \
            'zero-stage-profile backend=' \
            'final-nonadaptive-sweep'; do
            if grep -Fq "$forbidden" /tmp/lsfg-layer-strings.txt; then
              echo "ERROR: packaged benchmark layer contains profiler marker: $forbidden" >&2
              exit 1
            fi
          done

      - name: Inject debug credentials
        run: |
          printf 'POSTHOG_API_KEY=dummy\n' > local.properties
          printf 'POSTHOG_HOST=https://us.i.posthog.com\n' >> local.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Legacy unit tests
        run: ./gradlew :app:testLegacyDebugUnitTest --no-daemon

      - name: Assemble Adreno Clean Benchmark LegacyDebug
        run: ./gradlew :app:assembleLegacyDebug --no-daemon

      - name: Prepare Adreno Clean Benchmark APK
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/legacy/debug -maxdepth 1 -type f -name '*.apk' -print)
          test ${#apks[@]} -eq 1
          cp "${apks[0]}" gamenative-adreno6xx-clean-benchmark.apk
          sha256sum gamenative-adreno6xx-clean-benchmark.apk
          ls -lh gamenative-adreno6xx-clean-benchmark.apk

      - name: Upload Adreno Clean Benchmark APK
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-adreno6xx-clean-benchmark
          path: gamenative-adreno6xx-clean-benchmark.apk
          if-no-files-found: error
          compression-level: 0
