name: Adreno 6xx LSFG B12 Dual Stage Evidence

on:
  workflow_dispatch:
  push:
    branches:
      - feature/adreno-6xx-lsfg-optimization
      - fix/android-instance-dispatch-isolation
      - feature/adreno-6xx-candidate-b2-mipmaps
      - feature/adreno-6xx-candidate-b3-beta4-beta4-predicate
      - feature/adreno-6xx-candidate-b4-beta4-predicate
      - feature/adreno-6xx-candidate-b6-pipeline-exec-profile
      - feature/adreno-6xx-candidate-b8-mipmaps-matrix
      - feature/adreno-6xx-final-nonadaptive-sweep
      - feature/adreno-6xx-deferred-zero-b4
      - feature/adreno-6xx-clean-benchmark
      - feature/adreno-6xx-candidate-b11-beta4-pow2-mask
    paths:
      - app/src/main/cpp/lsfg-vk-android
      - app/src/test/java/app/gamenative/utils/LsfgBuildWorkflowContractTest.kt
      - .github/actions/prepare-lsfg-native/**
      - .github/workflows/lsfg-legacy-single-apk.yml

concurrency:
  group: gamenative-adreno6xx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checking out GameNative
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Verify pinned B11 Adreno LSFG native revision
        shell: bash
        run: |
          set -euo pipefail
          native_dir=app/src/main/cpp/lsfg-vk-android
          # Treat the GameNative gitlink as the single source of truth so this
          # guard follows deliberate LSFG pin updates instead of going stale.
          expected_native="$(git rev-parse HEAD:${native_dir})"
          git submodule update --init --recursive -- "$native_dir"
          actual_native="$(git -C "$native_dir" rev-parse HEAD)"
          test "$actual_native" = "$expected_native"
          echo "Verified pinned B11 LSFG native revision ${expected_native}"
          git diff --check

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Prepare GameNative-pinned B12 evidence runtime
        uses: ./.github/actions/prepare-lsfg-native
        env:
          LSFGVK_ADAPTIVE_RUNTIME: "1"
          LSFGVK_B12_DUAL_STAGE_PROFILE: "1"

      - name: Verify prepared B12 LSFG evidence layer
        shell: bash
        run: |
          set -euo pipefail
          layer=app/src/main/jniLibs/arm64-v8a/liblsfg-vk-layer.so
          test -f "$layer"
          strings "$layer" > /tmp/lsfg-layer-strings.txt
          for required in \
            'deferred-zero reprime-warmup-begin' \
            'deferred-zero reprime-deferred request_count=' \
            'candidate-b4-beta4-predicate-opt' \
            'candidate-b11-beta4-pow2-mask' \
            'b12-stage-profile' \
            'mipmaps_avg_ms=' \
            'beta4_avg_ms='; do
            if ! grep -Fq "$required" /tmp/lsfg-layer-strings.txt; then
              echo "ERROR: prepared B12 evidence layer is missing runtime marker: $required" >&2
              exit 1
            fi
          done
          for forbidden in \
            'pipeline-exec-ir-line' \
            'generated-stage-profile backend=' \
            'zero-stage-profile backend=' \
            'final-nonadaptive-sweep'; do
            if grep -Fq "$forbidden" /tmp/lsfg-layer-strings.txt; then
              echo "ERROR: prepared B12 evidence layer contains heavyweight profiler marker: $forbidden" >&2
              exit 1
            fi
          done

      - name: Inject debug credentials
        run: |
          printf 'POSTHOG_API_KEY=dummy\n' > local.properties
          printf 'POSTHOG_HOST=https://us.i.posthog.com\n' >> local.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Legacy unit tests
        run: ./gradlew :app:testLegacyDebugUnitTest --no-daemon

      - name: Assemble Adreno B12 LegacyDebug
        run: ./gradlew :app:assembleLegacyDebug --no-daemon

      - name: Prepare Adreno B12 evidence APK
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/legacy/debug -maxdepth 1 -type f -name '*.apk' -print)
          test ${#apks[@]} -eq 1
          cp "${apks[0]}" gamenative-adreno6xx-b12-dual-stage-evidence.apk
          sha256sum gamenative-adreno6xx-b12-dual-stage-evidence.apk
          ls -lh gamenative-adreno6xx-b12-dual-stage-evidence.apk

      - name: Verify APK contains B12 LSFG evidence layer
        shell: bash
        run: |
          set -euo pipefail
          apk=gamenative-adreno6xx-b12-dual-stage-evidence.apk
          apk_layer=/tmp/apk-liblsfg-vk-layer.so
          unzip -p "$apk" lib/arm64-v8a/liblsfg-vk-layer.so > "$apk_layer"
          test -s "$apk_layer"
          strings "$apk_layer" > /tmp/apk-lsfg-layer-strings.txt
          for required in \
            'deferred-zero reprime-warmup-begin' \
            'deferred-zero reprime-deferred request_count=' \
            'candidate-b4-beta4-predicate-opt' \
            'candidate-b11-beta4-pow2-mask' \
            'b12-stage-profile' \
            'mipmaps_avg_ms=' \
            'beta4_avg_ms='; do
            if ! grep -Fq "$required" /tmp/apk-lsfg-layer-strings.txt; then
              echo "ERROR: APK B12 LSFG layer is missing runtime marker: $required" >&2
              exit 1
            fi
          done
          for forbidden in \
            'pipeline-exec-ir-line' \
            'generated-stage-profile backend=' \
            'zero-stage-profile backend=' \
            'final-nonadaptive-sweep'; do
            if grep -Fq "$forbidden" /tmp/apk-lsfg-layer-strings.txt; then
              echo "ERROR: APK B12 LSFG layer contains heavyweight profiler marker: $forbidden" >&2
              exit 1
            fi
          done

      - name: Upload Adreno B12 evidence APK
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-adreno6xx-b12-dual-stage-evidence
          path: gamenative-adreno6xx-b12-dual-stage-evidence.apk
          if-no-files-found: error
          compression-level: 0
