name: Adreno 6xx LSFG B14 Mipmaps Evidence

on:
  workflow_dispatch:
  push:
    branches:
      - feature/adreno-6xx-lsfg-optimization
      - fix/android-instance-dispatch-isolation
      - feature/adreno-6xx-candidate-b2-mipmaps
      - feature/adreno-6xx-candidate-b3-beta4-beta4-predicate
      - feature/adreno-6xx-candidate-b4-beta4-predicate
      - feature/adreno-6xx-candidate-b6-pipeline-exec-profile
      - feature/adreno-6xx-candidate-b8-mipmaps-matrix
      - feature/adreno-6xx-final-nonadaptive-sweep
      - feature/adreno-6xx-deferred-zero-b4
      - feature/adreno-6xx-clean-benchmark
      - feature/adreno-6xx-candidate-b11-beta4-pow2-mask
    paths:
      - app/src/main/cpp/lsfg-vk-android
      - app/src/test/java/app/gamenative/utils/LsfgBuildWorkflowContractTest.kt
      - .github/actions/prepare-lsfg-native/**
      - .github/workflows/lsfg-legacy-single-apk.yml
      - scripts/wrapper/**

permissions:
  contents: write

concurrency:
  group: gamenative-adreno6xx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-gamenative:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out GameNative candidate
        uses: actions/checkout@v5

      - name: Check out pinned GameNative Mesa wrapper source
        uses: actions/checkout@v5
        with:
          repository: GameNative/mesa
          ref: cd0c2eb5482dbd51e196018799a0c9ee1b0e4226
          path: mesa-wrapper

      - name: Prove pristine wrapper fails subgroup forwarding regression
        shell: bash
        run: |
          set -euo pipefail
          source=mesa-wrapper/src/vulkan/wrapper/wrapper_physical_device.c
          set +e
          python3 scripts/wrapper/test_subgroup_forwarding.py "$source" > /tmp/wrapper-red.log 2>&1
          status=$?
          set -e
          cat /tmp/wrapper-red.log
          if [[ "$status" -eq 0 ]]; then
            echo 'ERROR: regression unexpectedly passed against the known-poisoned wrapper source' >&2
            exit 1
          fi
          grep -Fq 'SUBGROUP_FORWARDING_REGRESSION' /tmp/wrapper-red.log
          grep -Fq 'subgroup forwarding changed driver bytes' /tmp/wrapper-red.log
          echo 'RED verified: pristine wrapper corrupts forwarded subgroup masks'

      - name: Apply minimal subgroup forwarding fix
        shell: bash
        run: |
          set -euo pipefail
          source=mesa-wrapper/src/vulkan/wrapper/wrapper_physical_device.c
          python3 scripts/wrapper/apply_subgroup_forwarding_fix.py "$source"
          git -C mesa-wrapper diff --check
          git -C mesa-wrapper diff -- src/vulkan/wrapper/wrapper_physical_device.c

      - name: Verify fake-driver subgroup forwarding regression is green
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/wrapper/test_subgroup_forwarding.py \
            mesa-wrapper/src/vulkan/wrapper/wrapper_physical_device.c
          if grep -Eq '(subgroup_prop->supported(Operations|Stages)|vk11_prop->subgroupSupported(Operations|Stages))[[:space:]]*=' \
              mesa-wrapper/src/vulkan/wrapper/wrapper_physical_device.c; then
            echo 'ERROR: subgroup capability poisoning remains in wrapper source' >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Android SDK and wrapper build dependencies
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install wrapper toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y gettext-base zstd file pkg-config
          python -m pip install --upgrade pip
          pip install mako PyYAML meson ninja packaging
          sdkmanager --install 'ndk;27.3.13750724'

      - name: Configure patched wrapper for arm64
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          export ANDROID_NDK_HOME="$sdk_root/ndk/27.3.13750724"
          export MESON_WORKING_DIR="$GITHUB_WORKSPACE/mesa-wrapper"
          cd mesa-wrapper
          sed -i 's/#if defined(HAVE_MEMFD_CREATE) \&\& !defined __TERMUX__/#if defined(HAVE_MEMFD_CREATE)/' src/util/anon_file.c
          sed -i "s/dep_libudev = dependency('libudev', required : false)/dep_libudev = null_dep/g" meson.build
          unzip -q shims.zip -d ./
          envsubst < android.toml > android-arm64.toml
          common=(
            -Dbuildtype=release
            -Dplatforms=x11
            -Dandroid-stub=true
            -Dandroid-libbacktrace=disabled
            -Dplatform-sdk-version=30
            -Dglx=disabled
            -Dgbm=disabled
            -Degl=disabled
            -Dopengl=false
            -Dgles1=disabled
            -Dgles2=disabled
            -Dglvnd=disabled
            -Dllvm=disabled
            -Dvalgrind=disabled
            -Dgallium-drivers=
            -Dshared-glapi=disabled
            -Dzstd=disabled
            -Dvulkan-drivers=wrapper
          )
          PKG_CONFIG_LIBDIR="$PWD/shims" meson setup _build-arm64 --cross-file android-arm64.toml "${common[@]}"

      - name: Build patched wrapper for arm64
        shell: bash
        run: |
          set -euo pipefail
          ninja -C mesa-wrapper/_build-arm64 src/vulkan/wrapper/libvulkan_wrapper.so
          arm64=mesa-wrapper/_build-arm64/src/vulkan/wrapper/libvulkan_wrapper.so
          test -s "$arm64"
          file "$arm64" | tee /tmp/wrapper-arm64.file
          grep -Eq 'ARM aarch64|aarch64' /tmp/wrapper-arm64.file
          sha256sum "$arm64"

      - name: Replace wrapper-gamenative payload and verify binary identity
        shell: bash
        run: |
          set -euo pipefail
          asset=app/src/legacy/assets/graphics_driver/wrapper-gamenative.tzst
          built=mesa-wrapper/_build-arm64/src/vulkan/wrapper/libvulkan_wrapper.so
          shipped_sha=2aecf1c11cde57008a3cc5e1a551e095d7843d3aa84b3756953afc134035e7c5
          built_sha="$(sha256sum "$built" | awk '{print $1}')"
          test "$built_sha" != "$shipped_sha"
          old_dir="$(mktemp -d)"
          verify_dir="$(mktemp -d)"
          tar --zstd -xf "$asset" -C "$old_dir"
          mapfile -t targets < <(find "$old_dir" -type f -name libvulkan_wrapper.so -print)
          if [[ "${#targets[@]}" -ne 1 ]]; then
            echo "ERROR: expected one libvulkan_wrapper.so in wrapper-gamenative.tzst, found ${#targets[@]}" >&2
            find "$old_dir" -maxdepth 4 -type f -print >&2
            exit 1
          fi
          current_sha="$(sha256sum "${targets[0]}" | awk '{print $1}')"
          echo "Current packaged wrapper SHA-256: $current_sha"
          echo "Rebuilt patched wrapper SHA-256: $built_sha"
          if [[ "$current_sha" = "$shipped_sha" ]]; then
            mode="$(stat -c '%a' "${targets[0]}")"
            install -m "$mode" "$built" "${targets[0]}"
          elif [[ "$current_sha" = "$built_sha" ]]; then
            echo 'wrapper-gamenative asset already contains the verified patched wrapper'
          else
            echo "ERROR: wrapper asset contains unexpected libvulkan_wrapper.so SHA-256 $current_sha" >&2
            exit 1
          fi
          new_sha="$(sha256sum "${targets[0]}" | awk '{print $1}')"
          test "$new_sha" = "$built_sha"
          rm -f "$asset"
          tar --zstd -cf "$asset" -C "$old_dir" .
          tar --zstd -xf "$asset" -C "$verify_dir"
          mapfile -t verified < <(find "$verify_dir" -type f -name libvulkan_wrapper.so -print)
          test "${#verified[@]}" -eq 1
          verified_sha="$(sha256sum "${verified[0]}" | awk '{print $1}')"
          test "$verified_sha" = "$built_sha"
          sha256sum "$asset"
          printf '%s\n' "$shipped_sha" > wrapper-old-lib.sha256
          printf '%s\n' "$built_sha" > wrapper-new-lib.sha256

      - name: Upload verified wrapper evidence
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-subgroup-wrapper
          path: |
            app/src/legacy/assets/graphics_driver/wrapper-gamenative.tzst
            mesa-wrapper/_build-arm64/src/vulkan/wrapper/libvulkan_wrapper.so
            wrapper-old-lib.sha256
            wrapper-new-lib.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Commit verified wrapper-gamenative asset
        shell: bash
        run: |
          set -euo pipefail
          asset=app/src/legacy/assets/graphics_driver/wrapper-gamenative.tzst
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$asset"
          if git diff --cached --quiet; then
            echo 'Verified wrapper asset is already current; no commit needed'
          else
            git commit -m 'fix(wrapper): preserve driver subgroup capabilities [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  legacy-debug:
    needs: wrapper-gamenative
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checking out GameNative
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Use verified subgroup-capable wrapper asset
        uses: actions/download-artifact@v4
        with:
          name: gamenative-subgroup-wrapper
          path: /tmp/verified-wrapper

      - name: Install verified wrapper into candidate workspace
        shell: bash
        run: |
          set -euo pipefail
          src=/tmp/verified-wrapper/app/src/legacy/assets/graphics_driver/wrapper-gamenative.tzst
          dst=app/src/legacy/assets/graphics_driver/wrapper-gamenative.tzst
          test -s "$src"
          cp "$src" "$dst"
          old_sha="$(cat /tmp/verified-wrapper/wrapper-old-lib.sha256)"
          new_sha="$(cat /tmp/verified-wrapper/wrapper-new-lib.sha256)"
          test "$old_sha" = 2aecf1c11cde57008a3cc5e1a551e095d7843d3aa84b3756953afc134035e7c5
          test "$new_sha" != "$old_sha"
          echo "Using verified wrapper SHA-256 $new_sha"

      - name: Verify pinned B14 Adreno LSFG native revision
        shell: bash
        run: |
          set -euo pipefail
          native_dir=app/src/main/cpp/lsfg-vk-android
          expected_native="$(git rev-parse HEAD:${native_dir})"
          git submodule update --init --recursive -- "$native_dir"
          actual_native="$(git -C "$native_dir" rev-parse HEAD)"
          test "$actual_native" = "$expected_native"
          echo "Verified pinned B14 LSFG native revision ${expected_native}"
          git diff --check

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SPIR-V validator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y spirv-tools file zstd
          spirv-val --version

      - name: Prepare GameNative-pinned B14 evidence runtime
        uses: ./.github/actions/prepare-lsfg-native
        env:
          LSFGVK_ADAPTIVE_RUNTIME: "1"
          LSFGVK_B12_DUAL_STAGE_PROFILE: "1"
          LSFGVK_MIPMAPS_CANDIDATE_SCRIPT: scripts/apply-candidate-b14-mipmaps-tail-fusion.py

      - name: Build the same B14 native runtime for x86_64
        shell: bash
        env:
          ANDROID_ABI: x86_64
          ANDROID_NDK_VERSION: '27.3.13750724'
          LSFGVK_ADAPTIVE_RUNTIME: "1"
          LSFGVK_B12_DUAL_STAGE_PROFILE: "1"
          LSFGVK_MIPMAPS_CANDIDATE_SCRIPT: scripts/apply-candidate-b14-mipmaps-tail-fusion.py
        run: |
          set -euo pipefail
          native_dir=app/src/main/cpp/lsfg-vk-android
          expected_native="$(git rev-parse HEAD:${native_dir})"
          git -C "$native_dir" reset --hard "$expected_native"
          git -C "$native_dir" submodule update --init --recursive
          actual_native="$(git -C "$native_dir" rev-parse HEAD)"
          test "$actual_native" = "$expected_native"
          test -z "$(git -C "$native_dir" status --porcelain --untracked-files=no)"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          export ANDROID_NDK="$sdk_root/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="$ANDROID_NDK"
          export HOST_TAG=linux-x86_64
          test -d "$ANDROID_NDK"
          (cd "$native_dir" && bash ./scripts/build/android.sh Release)
          built="$native_dir/build-android-x86_64/dist/liblsfg-vk-x86_64.so"
          test -s "$built"
          file "$built" | tee /tmp/lsfg-x86.file
          grep -Eq 'x86-64|x86_64' /tmp/lsfg-x86.file
          sha256sum "$built"

      - name: Verify prepared B14 LSFG evidence layer
        shell: bash
        run: |
          set -euo pipefail
          layer=app/src/main/jniLibs/arm64-v8a/liblsfg-vk-layer.so
          test -f "$layer"
          strings "$layer" > /tmp/lsfg-layer-strings.txt
          for required in \
            'deferred-zero reprime-warmup-begin' \
            'deferred-zero reprime-deferred request_count=' \
            'candidate-b4-beta4-predicate-opt' \
            'candidate-b11-beta4-pow2-mask' \
            'candidate-b13-beta4-fused-mask' \
            'candidate-b14-mipmaps-tail-fusion' \
            'b12-stage-profile' \
            'mipmaps_avg_ms=' \
            'beta4_avg_ms=' \
            'b12-timestamp-capability' \
            'b12-timestamp-fallback' \
            'b12-device-profile'; do
            if ! grep -Fq "$required" /tmp/lsfg-layer-strings.txt; then
              echo "ERROR: prepared B14 evidence layer is missing runtime marker: $required" >&2
              exit 1
            fi
          done
          for forbidden in \
            'pipeline-exec-ir-line' \
            'generated-stage-profile backend=' \
            'zero-stage-profile backend=' \
            'final-nonadaptive-sweep'; do
            if grep -Fq "$forbidden" /tmp/lsfg-layer-strings.txt; then
              echo "ERROR: prepared B14 evidence layer contains heavyweight profiler marker: $forbidden" >&2
              exit 1
            fi
          done

      - name: Inject debug credentials
        run: |
          printf 'POSTHOG_API_KEY=dummy\n' > local.properties
          printf 'POSTHOG_HOST=https://us.i.posthog.com\n' >> local.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Legacy unit tests
        run: ./gradlew :app:testLegacyDebugUnitTest --no-daemon

      - name: Assemble Adreno B14 LegacyDebug
        run: ./gradlew :app:assembleLegacyDebug --no-daemon

      - name: Prepare Adreno B14 evidence APK
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/legacy/debug -maxdepth 1 -type f -name '*.apk' -print)
          test ${#apks[@]} -eq 1
          cp "${apks[0]}" gamenative-adreno6xx-b14-mipmaps-evidence.apk
          sha256sum gamenative-adreno6xx-b14-mipmaps-evidence.apk
          ls -lh gamenative-adreno6xx-b14-mipmaps-evidence.apk

      - name: Verify APK contains B14 LSFG evidence layer and patched wrapper asset
        shell: bash
        run: |
          set -euo pipefail
          apk=gamenative-adreno6xx-b14-mipmaps-evidence.apk
          apk_layer=/tmp/apk-liblsfg-vk-layer.so
          unzip -p "$apk" lib/arm64-v8a/liblsfg-vk-layer.so > "$apk_layer"
          test -s "$apk_layer"
          strings "$apk_layer" > /tmp/apk-lsfg-layer-strings.txt
          for required in \
            'deferred-zero reprime-warmup-begin' \
            'deferred-zero reprime-deferred request_count=' \
            'candidate-b4-beta4-predicate-opt' \
            'candidate-b11-beta4-pow2-mask' \
            'candidate-b13-beta4-fused-mask' \
            'candidate-b14-mipmaps-tail-fusion' \
            'b12-stage-profile' \
            'mipmaps_avg_ms=' \
            'beta4_avg_ms=' \
            'b12-timestamp-capability' \
            'b12-timestamp-fallback' \
            'b12-device-profile'; do
            grep -Fq "$required" /tmp/apk-lsfg-layer-strings.txt || {
              echo "ERROR: APK B14 LSFG layer is missing runtime marker: $required" >&2
              exit 1
            }
          done
          for forbidden in \
            'pipeline-exec-ir-line' \
            'generated-stage-profile backend=' \
            'zero-stage-profile backend=' \
            'final-nonadaptive-sweep'; do
            if grep -Fq "$forbidden" /tmp/apk-lsfg-layer-strings.txt; then
              echo "ERROR: APK B14 LSFG layer contains heavyweight profiler marker: $forbidden" >&2
              exit 1
            fi
          done
          apk_wrapper=/tmp/apk-wrapper-gamenative.tzst
          unzip -p "$apk" assets/graphics_driver/wrapper-gamenative.tzst > "$apk_wrapper"
          test -s "$apk_wrapper"
          apk_wrapper_dir="$(mktemp -d)"
          tar --zstd -xf "$apk_wrapper" -C "$apk_wrapper_dir"
          mapfile -t apk_wrappers < <(find "$apk_wrapper_dir" -type f -name libvulkan_wrapper.so -print)
          test "${#apk_wrappers[@]}" -eq 1
          apk_wrapper_sha="$(sha256sum "${apk_wrappers[0]}" | awk '{print $1}')"
          expected_wrapper_sha="$(cat /tmp/verified-wrapper/wrapper-new-lib.sha256)"
          echo "APK wrapper SHA-256: $apk_wrapper_sha"
          test "$apk_wrapper_sha" = "$expected_wrapper_sha"
          test "$apk_wrapper_sha" != 2aecf1c11cde57008a3cc5e1a551e095d7843d3aa84b3756953afc134035e7c5

      - name: Upload Adreno B14 evidence APK
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-adreno6xx-b14-mipmaps-evidence
          path: gamenative-adreno6xx-b14-mipmaps-evidence.apk
          if-no-files-found: error
          compression-level: 0
