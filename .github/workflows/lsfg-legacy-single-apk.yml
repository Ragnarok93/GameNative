name: Adreno 6xx LSFG LegacyDebug

on:
  workflow_dispatch:
  push:
    branches:
      - feature/adreno-6xx-lsfg-optimization
    paths:
      - app/src/main/cpp/lsfg-vk-android
      - .github/actions/prepare-lsfg-native/**
      - .github/workflows/lsfg-legacy-single-apk.yml

concurrency:
  group: gamenative-adreno6xx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checking out GameNative
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Verify pinned Adreno LSFG native revision
        shell: bash
        run: |
          set -euo pipefail
          native_dir=app/src/main/cpp/lsfg-vk-android
          expected_native=924d5a669c86dc5aa701b00ded9808659b993930
          actual_native="$(git rev-parse HEAD:${native_dir})"
          test "$actual_native" = "$expected_native"
          git submodule update --init --recursive -- "$native_dir"
          test "$(git -C "$native_dir" rev-parse HEAD)" = "$expected_native"
          git diff --check

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare GameNative-pinned LSFG native runtime
        uses: ./.github/actions/prepare-lsfg-native
        env:
          LSFGVK_ZERO_STAGE_PROFILE: "1"

      - name: Inject credentials
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          printf 'POSTHOG_API_KEY=%s\n' "${POSTHOG_API_KEY:-dummy}" > local.properties
          printf 'POSTHOG_HOST=%s\n' "${POSTHOG_HOST:-https://us.i.posthog.com}" >> local.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Legacy unit tests
        run: ./gradlew :app:testLegacyDebugUnitTest --no-daemon

      - name: Assemble Adreno LegacyDebug
        run: ./gradlew :app:assembleLegacyDebug --no-daemon

      - name: Prepare Adreno LegacyDebug APK
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/legacy/debug -maxdepth 1 -type f -name '*.apk' -print)
          test ${#apks[@]} -eq 1
          cp "${apks[0]}" gamenative-adreno6xx-legacy-debug.apk
          sha256sum gamenative-adreno6xx-legacy-debug.apk
          ls -lh gamenative-adreno6xx-legacy-debug.apk

      - name: Upload Adreno LegacyDebug APK
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-adreno6xx-legacy-debug
          path: gamenative-adreno6xx-legacy-debug.apk
          if-no-files-found: error
          compression-level: 0
