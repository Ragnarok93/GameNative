name: LSFG LegacyDebug single APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/lsfg-transition-stability-20260831
      - fix/lsfg-prerelease-debug

jobs:
  legacy-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checking out GameNative
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare GameNative-pinned LSFG native runtime
        uses: ./.github/actions/prepare-lsfg-native

      - name: Inject credentials
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          printf 'POSTHOG_API_KEY=%s\n' "${POSTHOG_API_KEY:-dummy}" > local.properties
          printf 'POSTHOG_HOST=%s\n' "${POSTHOG_HOST:-https://us.i.posthog.com}" >> local.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble LegacyDebug only
        run: ./gradlew :app:assembleLegacyDebug --no-daemon

      - name: Prepare and verify single LegacyDebug APK
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/legacy/debug -maxdepth 1 -type f -name '*.apk' -print)
          test ${#apks[@]} -eq 1
          cp "${apks[0]}" gamenative-legacy-debug.apk

          expected_native=app/src/main/jniLibs/arm64-v8a/liblsfg-vk-layer.so
          packaged_native=/tmp/liblsfg-vk-layer.packaged.so
          test -s "$expected_native"
          unzip -p gamenative-legacy-debug.apk lib/arm64-v8a/liblsfg-vk-layer.so > "$packaged_native"
          test -s "$packaged_native"

          expected_hash="$(sha256sum "$expected_native" | awk '{print $1}')"
          packaged_hash="$(sha256sum "$packaged_native" | awk '{print $1}')"
          expected_commit="$(git rev-parse HEAD:app/src/main/cpp/lsfg-vk-android)"
          expected_prefix="${expected_commit:0:8}"

          echo "LSFG gitlink:          $expected_commit"
          echo "LSFG prepared SHA256: $expected_hash"
          echo "LSFG packaged SHA256: $packaged_hash"
          test "$expected_hash" = "$packaged_hash"

          marker_hits="$(for dex in $(zipinfo -1 gamenative-legacy-debug.apk | grep -E '^classes[0-9]*\.dex$'); do unzip -p gamenative-legacy-debug.apk "$dex" | strings; done | grep -F -c "$expected_prefix" || true)"
          echo "LSFG runtime marker hits for $expected_prefix: $marker_hits"
          test "$marker_hits" -ge 1

          sha256sum gamenative-legacy-debug.apk
          ls -lh gamenative-legacy-debug.apk

      - name: Upload single LegacyDebug APK
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-legacy-debug
          path: gamenative-legacy-debug.apk
          if-no-files-found: error
          compression-level: 0
