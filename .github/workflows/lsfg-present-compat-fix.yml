name: Temporary LSFG Present compatibility fix

on:
  push:
    branches:
      - fix/lsfg-prerelease-debug
    paths:
      - .github/workflows/lsfg-present-compat-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/lsfg-prerelease-debug
      - name: Restore branch-compatible upstream Present path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/winlator/xserver/extensions/PresentExtension.java')
          s = p.read_text()
          block = '''        if (!client.xServer.isFlatPresentationEnabled()) {\n            sendCompleteNotify(window, serial, Kind.PIXMAP, Mode.SKIP, ust, msc);\n            if (targetFps > 0) scheduleIdleNotify(window, pixmap, serial, idleFence, targetFps, vr);\n            else sendIdleNotify(window, pixmap, serial, idleFence);\n            return;\n        }\n\n'''
          if block not in s:
              raise SystemExit('expected incompatible flat-presentation block not found')
          s = s.replace(block, '', 1)
          if 'isFlatPresentationEnabled()' in s:
              raise SystemExit('flat-presentation API reference remains')
          if 'refreshLsfgPacingState()' in s or 'transitionLsfgFramePacing' in s:
              raise SystemExit('per-present LSFG pacing hook unexpectedly remains')
          p.write_text(s)
          PY
          git diff --check
          git diff -- app/src/main/java/com/winlator/xserver/extensions/PresentExtension.java
      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/winlator/xserver/extensions/PresentExtension.java
          git commit -m 'fix(lsfg): keep Present path compatible with branch baseline'
          git push origin HEAD:fix/lsfg-prerelease-debug
