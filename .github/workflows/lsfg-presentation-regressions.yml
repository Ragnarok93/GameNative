name: LSFG presentation regressions
on:
  push:
    branches: ["feature/**", "fix/**"]
    paths:
      - "app/src/main/cpp/**"
      - "tools/*lsfg*test.py"
      - ".github/workflows/lsfg-presentation-regressions.yml"
  pull_request:
    paths:
      - "app/src/main/cpp/**"
      - "tools/*lsfg*test.py"
      - ".github/workflows/lsfg-presentation-regressions.yml"
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Exercise production presentation, cadence, feedback and cache code
        run: python3 tools/lsfg_presentation_regression_test.py
      - name: Exercise existing display timing, Native bridge and Native pacer
        run: |
          python3 tools/host_display_timing_test.py
          python3 tools/native_lsfg_bridge_test.py
          python3 tools/native_lsfg_pacer_test.py
