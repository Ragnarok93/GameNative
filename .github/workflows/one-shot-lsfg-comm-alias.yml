name: LSFG Wine process alias patch

on:
  push:
    branches:
      - fix/lsfg-discovery-material-you

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lsfg-discovery-material-you
          fetch-depth: 0
      - run: python3 tools/apply_lsfg_comm_alias_patch.py
      - run: git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm tools/apply_lsfg_comm_alias_patch.py .github/workflows/one-shot-lsfg-comm-alias.yml
          git add -A
          git commit -m "fix: match long Wine process names for LSFG"
          git push origin HEAD:fix/lsfg-discovery-material-you
