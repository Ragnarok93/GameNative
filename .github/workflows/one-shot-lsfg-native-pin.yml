name: One-shot verified LSFG native pin

on:
  push:
    branches:
      - Adaptive-Frame-Generation
    paths:
      - .github/workflows/one-shot-lsfg-native-pin.yml

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Adaptive-Frame-Generation
          fetch-depth: 0
          submodules: false
      - name: Pin verified native runtime
        env:
          NATIVE_SHA: 7910aa0fca6b5992fadd9ec78cad3e02c31fe222
        run: |
          git submodule update --init app/src/main/cpp/lsfg-vk-android
          git -C app/src/main/cpp/lsfg-vk-android fetch origin "$NATIVE_SHA"
          git -C app/src/main/cpp/lsfg-vk-android checkout --detach "$NATIVE_SHA"
          python3 - <<'PY'
          from pathlib import Path
          sha = '7910aa0fca6b5992fadd9ec78cad3e02c31fe222'

          manager = Path('app/src/main/java/app/gamenative/utils/LsfgVkManager.kt')
          text = manager.read_text()
          import re
          pattern = r'v1\.3\.7-android-arm64-v8a-gamenative-adaptive-[0-9a-f]+-r\d+'
          replacement = 'v1.3.7-android-arm64-v8a-gamenative-adaptive-7910aa0f-r13'
          updated, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit('runtime marker did not match expected pattern')
          manager.write_text(updated)

          pin = Path('docs/adaptive-frame-generation-native-pin.txt')
          pin.write_text(f'Intended lsfg-vk-android Adaptive-Frame-Generation revision: {sha}\n')
          PY
      - name: Commit verified pin
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/cpp/lsfg-vk-android app/src/main/java/app/gamenative/utils/LsfgVkManager.kt docs/adaptive-frame-generation-native-pin.txt
          if git diff --cached --quiet; then
            echo 'Verified native runtime already pinned'
            exit 0
          fi
          git commit -m 'build(lsfg): pin verified adaptive runtime 7910aa0f'
          git push origin HEAD:Adaptive-Frame-Generation
