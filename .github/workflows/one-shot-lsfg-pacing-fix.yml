name: One-shot LSFG pacing handoff fix

on:
  push:
    branches:
      - Adaptive-Frame-Generation
    paths:
      - .github/workflows/one-shot-lsfg-pacing-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Adaptive-Frame-Generation
          fetch-depth: 0
      - name: Apply native-ready pacing ownership fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          screen = Path('app/src/main/java/app/gamenative/ui/screen/xserver/XServerScreen.kt')
          text = screen.read_text()
          old = '        xServerView?.setFrameRateLimit(if (lsfgActive) 0 else limit)\n'
          new = '        xServerView?.transitionLsfgFramePacing(lsfgActive, limit)\n'
          if old in text:
              text = text.replace(old, new, 1)
              screen.write_text(text)
          elif new not in text:
              raise SystemExit('XServerScreen pacing call site did not match expected source')

          iface = Path('app/src/main/java/com/winlator/widget/XServerRendererView.java')
          text = iface.read_text()
          old = '    void setFrameRateLimit(int limit);\n'
          new = '''    void setFrameRateLimit(int limit);\n\n    /**\n     * Request LSFG presentation ownership while retaining local pacing until\n     * the native layer reports a live generation-ready swapchain. Renderers\n     * that do not participate in LSFG keep their ordinary local limiter.\n     */\n    default void transitionLsfgFramePacing(boolean lsfgRequested, int localLimit) {\n        setFrameRateLimit(localLimit);\n    }\n'''
          if old in text and 'default void transitionLsfgFramePacing' not in text:
              text = text.replace(old, new, 1)
              iface.write_text(text)
          elif 'transitionLsfgFramePacing' not in text:
              raise SystemExit('XServerRendererView insertion point did not match expected source')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo 'Pacing fix already present'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/app/gamenative/ui/screen/xserver/XServerScreen.kt app/src/main/java/com/winlator/widget/XServerRendererView.java
          git commit -m 'fix(lsfg): gate pacing handoff on native readiness'
          git push origin HEAD:Adaptive-Frame-Generation
