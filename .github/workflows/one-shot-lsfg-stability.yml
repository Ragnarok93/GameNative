name: LSFG stability patch

on:
  push:
    branches:
      - fix/lsfg-discovery-material-you

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lsfg-discovery-material-you
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/apply_lsfg_stability_patch.py
      - name: Verify diff
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm tools/apply_lsfg_stability_patch.py .github/workflows/one-shot-lsfg-stability.yml
          git add -A
          git commit -m "fix: target LSFG to the actual game process"
          git push origin HEAD:fix/lsfg-discovery-material-you
