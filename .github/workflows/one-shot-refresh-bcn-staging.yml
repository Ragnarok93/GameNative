name: One-shot refresh BCn staging transform

on:
  workflow_dispatch:
  push:
    branches:
      - automation/bcn-staging-drift-fix-20260909
    paths:
      - .github/workflows/one-shot-refresh-bcn-staging.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BCn feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/bcn-emulation-optimization
          fetch-depth: 0

      - name: Refresh command-buffer lifecycle anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/wrapper-bcn-staging/apply.py')
          text = p.read_text()

          old_init = r'''    """   wcb->pool = pool;
             wcb->dispatch_handle = dispatch_handle;
             list_add(&wcb->link, &device->command_buffer_list);
          """,
              """   wcb->pool = pool;
             wcb->dispatch_handle = dispatch_handle;
             list_inithead(&wcb->bcn_buffers);
             list_add(&wcb->link, &device->command_buffer_list);
          """,
          '''
          new_init = r'''    """   wcb->pool = pool;
             wcb->dispatch_handle = dispatch_handle;
             list_inithead(&wcb->dynamic_render_objects);
             list_add(&wcb->link, &device->command_buffer_list);
          """,
              """   wcb->pool = pool;
             wcb->dispatch_handle = dispatch_handle;
             list_inithead(&wcb->dynamic_render_objects);
             list_inithead(&wcb->bcn_buffers);
             list_add(&wcb->link, &device->command_buffer_list);
          """,
          '''
          if old_init not in text:
              raise SystemExit('command-buffer init script anchor not found')
          text = text.replace(old_init, new_init, 1)

          old_destroy = r'''    """   if (device->emulate_push_descriptor)
                wrapper_push_pool_destroy_all(wcb);
             wrapper_bcn_pool_destroy_all(wcb);

             device->dispatch_table.FreeCommandBuffers(""",
              """   wrapper_bcn_release_cb_buffers(wcb);
             if (device->emulate_push_descriptor)
                wrapper_push_pool_destroy_all(wcb);
             wrapper_bcn_pool_destroy_all(wcb);

             device->dispatch_table.FreeCommandBuffers(""",
          '''
          new_destroy = r'''    """   if (device->emulate_push_descriptor)
                wrapper_push_pool_destroy_all(wcb);
             wrapper_bcn_pool_destroy_all(wcb);
             wrapper_dynamic_render_objects_reset(wcb);

             device->dispatch_table.FreeCommandBuffers(""",
              """   wrapper_bcn_release_cb_buffers(wcb);
             if (device->emulate_push_descriptor)
                wrapper_push_pool_destroy_all(wcb);
             wrapper_bcn_pool_destroy_all(wcb);
             wrapper_dynamic_render_objects_reset(wcb);

             device->dispatch_table.FreeCommandBuffers(""",
          '''
          if old_destroy not in text:
              raise SystemExit('command-buffer destroy script anchor not found')
          text = text.replace(old_destroy, new_destroy, 1)

          p.write_text(text)
          PY
          python3 -m py_compile tools/wrapper-bcn-staging/apply.py
          git diff --check

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo 'No change required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/wrapper-bcn-staging/apply.py
          git commit -m 'fix: preserve wrapper command-buffer lifecycle state'
          git push origin HEAD:feature/bcn-emulation-optimization
