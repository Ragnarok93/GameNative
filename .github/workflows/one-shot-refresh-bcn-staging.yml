name: One-shot refresh BCn staging transform

on:
  workflow_dispatch:
  push:
    branches:
      - automation/bcn-staging-drift-fix-20260909
    paths:
      - .github/workflows/one-shot-refresh-bcn-staging.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BCn feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/bcn-emulation-optimization
          fetch-depth: 0

      - name: Refresh ResetCommandPool transform
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/wrapper-bcn-staging/apply.py')
          text = p.read_text()
          start_marker = '# ResetCommandPool also makes every child command buffer safe for reuse.\n'
          end_marker = '# New command buffers start with an empty active internal-buffer list.\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = r'''# ResetCommandPool also makes every child command buffer safe for reuse.
          # Scope this transform to the function instead of matching the entire upstream
          # block verbatim; comments/indentation may drift without changing semantics.
          pool_fn = device.index("VKAPI_ATTR VkResult VKAPI_CALL\nwrapper_ResetCommandPool")
          gate_start = device.index("   /* Both of these walk", pool_fn)
          return_start = device.index("   return device->dispatch_table.ResetCommandPool", gate_start)
          new_pool_gate = """   /* Dynamic-rendering, push-descriptor, and BCn transient objects all follow
           * command-buffer lifetime. Include BCn in the gate so a pool reset releases
           * its internal buffers even when the other emulation modes are inactive. */
             if (device->emulate_push_descriptor ||
                 device->physical->emulate_imageless_framebuffer ||
                 device->physical->emulate_vulkan13 ||
                 device->physical->emulate_bcn > 1) {
                simple_mtx_lock(&device->resource_mutex);
                list_for_each_entry(struct wrapper_command_buffer, wcb,
                                    &device->command_buffer_list, link) {
                   if (wcb->pool == commandPool) {
                      wrapper_dynamic_render_objects_reset(wcb);
                      if (device->emulate_push_descriptor)
                         wrapper_push_pool_reset_all(wcb);
                      wrapper_bcn_release_cb_buffers(wcb);
                      wrapper_bcn_pool_reset_all(wcb);
                   }
                }
                simple_mtx_unlock(&device->resource_mutex);
             }
          """
          device = device[:gate_start] + new_pool_gate + device[return_start:]

          '''
          p.write_text(text[:start] + replacement + text[end:])
          PY
          python3 -m py_compile tools/wrapper-bcn-staging/apply.py
          git diff --check

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo 'No change required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/wrapper-bcn-staging/apply.py
          git commit -m 'fix: make BCn staging reset transform drift-tolerant'
          git push origin HEAD:feature/bcn-emulation-optimization
