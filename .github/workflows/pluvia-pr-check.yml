name: Pull Request build check

on:
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'keyvalues/**'
      - 'media/**'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: gamenative-pr-${{ github.event.pull_request.number }}-lsfg-targeted
  cancel-in-progress: true

jobs:
  legacy-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checking out GameNative
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Prepare GameNative-pinned LSFG native runtime
        uses: ./.github/actions/prepare-lsfg-native

      - name: Inject credentials
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          printf 'POSTHOG_API_KEY=%s\n' "${POSTHOG_API_KEY:-dummy}" > local.properties
          printf 'POSTHOG_HOST=%s\n' "${POSTHOG_HOST:-https://us.i.posthog.com}" >> local.properties

      - name: Inject dummy credentials
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          cat <<EOF > local.properties
          POSTHOG_API_KEY=dummy
          POSTHOG_HOST=https://us.i.posthog.com
          EOF

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run LSFG and FrameRating Legacy tests
        run: >-
          ./gradlew :app:testLegacyDebugUnitTest --no-daemon
          --tests app.gamenative.utils.LsfgVkManagerTest
          --tests app.gamenative.utils.LsfgQuickMenuHelperModeTest
          --tests app.gamenative.utils.LsfgAdaptiveFlowUiContractTest
          --tests app.gamenative.utils.LsfgBuildWorkflowContractTest
          --tests app.gamenative.utils.LsfgPacingCallSiteContractTest
          --tests app.gamenative.powercontrol.metrics.FrameTimeRingTest
          --tests com.winlator.widget.FrameRatingTest
          --tests com.winlator.widget.XServerFrameRatingRetargetContractTest
          --tests com.winlator.widget.XServerViewLsfgPacingContractTest

      - name: Assemble Legacy debug APK
        run: ./gradlew :app:assembleLegacyDebug --no-daemon

      - name: Stage verified LegacyDebug APK
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/legacy/debug -maxdepth 1 -type f -name '*.apk' -print)
          if [[ ${#apks[@]} -ne 1 ]]; then
            printf 'Expected exactly one LegacyDebug APK, found %d\n' "${#apks[@]}" >&2
            printf '%s\n' "${apks[@]}" >&2
            exit 1
          fi
          mkdir -p /tmp/gamenative-legacy-debug
          apk=/tmp/gamenative-legacy-debug/gamenative-legacy-debug.apk
          cp "${apks[0]}" "$apk"
          sha256sum "$apk" | tee /tmp/gamenative-legacy-debug/gamenative-legacy-debug.apk.sha256
          test -s "$apk"
          test -s /tmp/gamenative-legacy-debug/gamenative-legacy-debug.apk.sha256
          ls -lh /tmp/gamenative-legacy-debug/

      - name: Upload LegacyDebug APK
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-legacy-debug
          path: |
            /tmp/gamenative-legacy-debug/gamenative-legacy-debug.apk
            /tmp/gamenative-legacy-debug/gamenative-legacy-debug.apk.sha256
          if-no-files-found: error
          compression-level: 0
