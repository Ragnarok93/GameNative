name: Pull Request build check

on:
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'keyvalues/**'
      - 'media/**'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Legacy)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checking out GameNative
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Inject build credentials
        env:
          POSTHOG_API_KEY_SECRET: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST_SECRET: ${{ secrets.POSTHOG_HOST }}
          STEAMGRIDDB_API_KEY_SECRET: ${{ secrets.STEAMGRIDDB_API_KEY }}
          CLOUD_PROJECT_NUMBER_SECRET: ${{ secrets.CLOUD_PROJECT_NUMBER }}
        run: |
          cat <<EOF > local.properties
          POSTHOG_API_KEY=${POSTHOG_API_KEY_SECRET:-dummy}
          POSTHOG_HOST=${POSTHOG_HOST_SECRET:-https://us.i.posthog.com}
          STEAMGRIDDB_API_KEY=${STEAMGRIDDB_API_KEY_SECRET:-dummy}
          CLOUD_PROJECT_NUMBER=${CLOUD_PROJECT_NUMBER_SECRET:-dummy}
          EOF

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Legacy unit tests
        run: ./gradlew :app:testLegacyDebugUnitTest --stacktrace

      - name: Upload Legacy test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-test-report-Legacy-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/testLegacyDebugUnitTest/
            app/build/test-results/testLegacyDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

  build-legacy:
    name: Build legacy debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checking out GameNative
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Inject build credentials
        env:
          POSTHOG_API_KEY_SECRET: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST_SECRET: ${{ secrets.POSTHOG_HOST }}
          STEAMGRIDDB_API_KEY_SECRET: ${{ secrets.STEAMGRIDDB_API_KEY }}
          CLOUD_PROJECT_NUMBER_SECRET: ${{ secrets.CLOUD_PROJECT_NUMBER }}
        run: |
          cat <<EOF > local.properties
          POSTHOG_API_KEY=${POSTHOG_API_KEY_SECRET:-dummy}
          POSTHOG_HOST=${POSTHOG_HOST_SECRET:-https://us.i.posthog.com}
          STEAMGRIDDB_API_KEY=${STEAMGRIDDB_API_KEY_SECRET:-dummy}
          CLOUD_PROJECT_NUMBER=${CLOUD_PROJECT_NUMBER_SECRET:-dummy}
          EOF

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble legacy debug APK
        run: ./gradlew :app:assembleLegacyDebug --stacktrace

      - name: Upload legacy debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-legacy-debug-${{ github.sha }}
          path: app/build/outputs/apk/legacy/debug/app-legacy-debug.apk
          if-no-files-found: error
          retention-days: 14
