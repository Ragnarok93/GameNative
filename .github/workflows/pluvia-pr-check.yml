name: Pull Request build check

on:
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'keyvalues/**'
      - 'media/**'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flavor: [Legacy, Modern]

    steps:
      - name: Checking out GameNative
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Inject build credentials
        env:
          POSTHOG_API_KEY_SECRET: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST_SECRET: ${{ secrets.POSTHOG_HOST }}
          STEAMGRIDDB_API_KEY_SECRET: ${{ secrets.STEAMGRIDDB_API_KEY }}
          CLOUD_PROJECT_NUMBER_SECRET: ${{ secrets.CLOUD_PROJECT_NUMBER }}
        run: |
          cat <<EOF > local.properties
          POSTHOG_API_KEY=${POSTHOG_API_KEY_SECRET:-dummy}
          POSTHOG_HOST=${POSTHOG_HOST_SECRET:-https://us.i.posthog.com}
          STEAMGRIDDB_API_KEY=${STEAMGRIDDB_API_KEY_SECRET:-dummy}
          CLOUD_PROJECT_NUMBER=${CLOUD_PROJECT_NUMBER_SECRET:-dummy}
          EOF

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run ${{ matrix.flavor }} unit tests
        run: ./gradlew :app:test${{ matrix.flavor }}DebugUnitTest --stacktrace

      - name: Upload ${{ matrix.flavor }} test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-test-report-${{ matrix.flavor }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/test${{ matrix.flavor }}DebugUnitTest/
            app/build/test-results/test${{ matrix.flavor }}DebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

  build-modern:
    name: Build modern debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checking out GameNative
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Inject build credentials
        env:
          POSTHOG_API_KEY_SECRET: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST_SECRET: ${{ secrets.POSTHOG_HOST }}
          STEAMGRIDDB_API_KEY_SECRET: ${{ secrets.STEAMGRIDDB_API_KEY }}
          CLOUD_PROJECT_NUMBER_SECRET: ${{ secrets.CLOUD_PROJECT_NUMBER }}
        run: |
          cat <<EOF > local.properties
          POSTHOG_API_KEY=${POSTHOG_API_KEY_SECRET:-dummy}
          POSTHOG_HOST=${POSTHOG_HOST_SECRET:-https://us.i.posthog.com}
          STEAMGRIDDB_API_KEY=${STEAMGRIDDB_API_KEY_SECRET:-dummy}
          CLOUD_PROJECT_NUMBER=${CLOUD_PROJECT_NUMBER_SECRET:-dummy}
          EOF

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble modern debug APK
        run: ./gradlew :app:assembleModernDebug --stacktrace

      - name: Upload modern debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-modern-debug-${{ github.sha }}
          path: app/build/outputs/apk/modern/debug/app-modern-debug.apk
          if-no-files-found: error
          retention-days: 14
