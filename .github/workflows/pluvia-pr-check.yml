name: Pull Request build check

on:
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'keyvalues/**'
      - 'media/**'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: write

concurrency:
  group: gamenative-pr-${{ github.event.pull_request.number }}-lsfg-targeted
  cancel-in-progress: true

jobs:
  legacy-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checking out GameNative
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          submodules: recursive

      - name: Bootstrap adaptive native source limiter bridge
        if: github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          manager=app/src/main/java/app/gamenative/utils/LsfgVkManager.kt
          helper=app/src/main/java/app/gamenative/utils/LsfgQuickMenuHelper.kt
          screen=app/src/main/java/app/gamenative/ui/screen/xserver/XServerScreen.kt
          native_dir=app/src/main/cpp/lsfg-vk-android
          native_sha=91c241e7a64a445e93f314674ba160d9318565e6

          python3 - "$manager" "$helper" "$screen" <<'PY'
          import pathlib
          import sys

          manager = pathlib.Path(sys.argv[1])
          helper = pathlib.Path(sys.argv[2])
          screen = pathlib.Path(sys.argv[3])

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"ERROR: {label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          manager_text = manager.read_text(encoding="utf-8")
          if "sourceFpsLimitOverride" not in manager_text:
              manager_text = replace_once(
                  manager_text,
                  '    const val EXTRA_ADAPTIVE_OUTPUT_TARGET = "lsfgAdaptiveOutputTarget"\n',
                  '    const val EXTRA_ADAPTIVE_OUTPUT_TARGET = "lsfgAdaptiveOutputTarget"\n'
                  '    private const val EXTRA_SOURCE_FPS_LIMITER_ENABLED = "fpsLimiterEnabled"\n'
                  '    private const val EXTRA_SOURCE_FPS_LIMITER_TARGET = "fpsLimiterTarget"\n',
                  "source limiter extra keys",
              )
              manager_text = replace_once(
                  manager_text,
                  '    fun fpsLimit(container: Container): Int = adaptiveOutputTarget(container)\n',
                  '    fun fpsLimit(container: Container): Int = adaptiveOutputTarget(container)\n\n'
                  '    /** Real/source Vulkan present ceiling, independent from Adaptive output FPS. */\n'
                  '    fun sourceFpsLimit(container: Container): Int {\n'
                  '        if (!parseBool(container.getExtra(EXTRA_SOURCE_FPS_LIMITER_ENABLED, "false"))) return 0\n'
                  '        return container.getExtra(EXTRA_SOURCE_FPS_LIMITER_TARGET, "0")\n'
                  '            .toIntOrNull()\n'
                  '            ?.coerceAtLeast(0)\n'
                  '            ?: 0\n'
                  '    }\n',
                  "source limiter reader",
              )
              manager_text = replace_once(
                  manager_text,
                  '                appendLine("fps_limit = ${fpsLimit.coerceAtLeast(0)}")\n'
                  '                appendLine("experimental_present_mode = ${tomlString(if (enabled) presentMode else "fifo")}")\n',
                  '                appendLine("fps_limit = ${fpsLimit.coerceAtLeast(0)}")\n'
                  '                appendLine("source_fps_limit = 0")\n'
                  '                appendLine("experimental_present_mode = ${tomlString(if (enabled) presentMode else "fifo")}")\n',
                  "source limiter TOML field",
              )
              manager_text = replace_once(
                  manager_text,
                  '                fpsLimit = outputTarget,\n'
                  '                presentMode = presentMode(container),\n'
                  '            )\n'
                  '            writeConfigAtomic(configFile, configText)\n',
                  '                fpsLimit = outputTarget,\n'
                  '                presentMode = presentMode(container),\n'
                  '            ).replace(\n'
                  '                "source_fps_limit = 0",\n'
                  '                "source_fps_limit = ${sourceFpsLimit(container)}",\n'
                  '            )\n'
                  '            writeConfigAtomic(configFile, configText)\n',
                  "launch source limiter serialization",
              )
              manager_text = replace_once(
                  manager_text,
                  '        adaptiveFrameGen: Boolean,\n'
                  '        fpsLimitOverride: Int? = null,\n'
                  '    ): Boolean {\n',
                  '        adaptiveFrameGen: Boolean,\n'
                  '        fpsLimitOverride: Int? = null,\n'
                  '        sourceFpsLimitOverride: Int? = null,\n'
                  '    ): Boolean {\n',
                  "runtime source limiter override",
              )
              manager_text = replace_once(
                  manager_text,
                  '            val effectiveOutputTarget =\n'
                  '                (fpsLimitOverride ?: adaptiveOutputTarget(container)).coerceAtLeast(0)\n'
                  '            val adaptiveEffective =\n',
                  '            val effectiveOutputTarget =\n'
                  '                (fpsLimitOverride ?: adaptiveOutputTarget(container)).coerceAtLeast(0)\n'
                  '            val effectiveSourceFpsLimit =\n'
                  '                (sourceFpsLimitOverride ?: sourceFpsLimit(container)).coerceAtLeast(0)\n'
                  '            val adaptiveEffective =\n',
                  "runtime effective source limiter",
              )
              manager_text = replace_once(
                  manager_text,
                  '                fpsLimit = effectiveOutputTarget,\n'
                  '                presentMode = presentMode(container),\n'
                  '            )\n\n'
                  '            val ok = writeConfigAtomic(configFile, configText)\n',
                  '                fpsLimit = effectiveOutputTarget,\n'
                  '                presentMode = presentMode(container),\n'
                  '            ).replace(\n'
                  '                "source_fps_limit = 0",\n'
                  '                "source_fps_limit = $effectiveSourceFpsLimit",\n'
                  '            )\n\n'
                  '            val ok = writeConfigAtomic(configFile, configText)\n',
                  "runtime source limiter serialization",
              )
              manager.write_text(manager_text, encoding="utf-8")

          helper_text = helper.read_text(encoding="utf-8")
          old_helper = '''    fun applyLiveFpsCap(container: Container, capFps: Int) {
              Timber.tag(TAG).d(
                  "Source FPS cap changed to %d; preserving LSFG output target %d",
                  capFps.coerceAtLeast(0),
                  LsfgVkManager.adaptiveOutputTarget(container),
              )
          }
'''
          new_helper = '''    fun applyLiveFpsCap(container: Container, capFps: Int) {
              applyExecutor.execute {
                  val sourceLimit = capFps.coerceAtLeast(0)
                  val settings = readSettings(container)
                  val applied = LsfgVkManager.updateConfigAtRuntime(
                      container = container,
                      enabled = settings.multiplier >= 2,
                      multiplier = if (settings.multiplier >= 2) settings.multiplier else 2,
                      flowScale = settings.flowScale,
                      performanceMode = settings.performanceMode,
                      adaptiveFrameGen = settings.adaptiveFrameGen,
                      fpsLimitOverride = null,
                      sourceFpsLimitOverride = sourceLimit,
                  )
                  Timber.tag(TAG).d(
                      "Source FPS cap hot-reload: source=%d output=%d applied=%s",
                      sourceLimit,
                      LsfgVkManager.adaptiveOutputTarget(container),
                      applied,
                  )
              }
          }
'''
          if "sourceFpsLimitOverride = sourceLimit" not in helper_text:
              helper_text = replace_once(helper_text, old_helper, new_helper, "live source cap bridge")
              helper.write_text(helper_text, encoding="utf-8")

          screen_text = screen.read_text(encoding="utf-8")
          if "LsfgQuickMenuHelper.applyLiveFpsCap(container, limit)" not in screen_text:
              screen_text = replace_once(
                  screen_text,
                  '        ShmFramePacer.setFrameRateLimit(limit)\n'
                  '        PowerManager.targetFps = limit\n'
                  '        // keeps frame stats in base units while generated frames tick the ring\n',
                  '        ShmFramePacer.setFrameRateLimit(limit)\n'
                  '        PowerManager.targetFps = limit\n'
                  '        if (lsfgActive) {\n'
                  '            LsfgQuickMenuHelper.applyLiveFpsCap(container, limit)\n'
                  '        }\n'
                  '        // keeps frame stats in base units while generated frames tick the ring\n',
                  "XServer native source cap handoff",
              )
              screen.write_text(screen_text, encoding="utf-8")
          PY

          git -C "$native_dir" fetch origin Adaptive-Frame-Generation
          git -C "$native_dir" checkout --detach "$native_sha"

          grep -Fq 'source_fps_limit = 0' "$manager"
          grep -Fq 'sourceFpsLimitOverride' "$manager"
          grep -Fq 'sourceFpsLimitOverride = sourceLimit' "$helper"
          grep -Fq 'LsfgQuickMenuHelper.applyLiveFpsCap(container, limit)' "$screen"
          test "$(git -C "$native_dir" rev-parse HEAD)" = "$native_sha"

          git add "$manager" "$helper" "$screen" "$native_dir"
          if git diff --cached --quiet; then
            echo 'Adaptive native source limiter bridge already applied.'
            exit 0
          fi
          git diff --cached --check
          git config user.name 'Ragnarok93'
          git config user.email 'e_fontenot1@yahoo.com'
          git commit -m 'feat(lsfg): wire native source fps pacing'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare GameNative-pinned LSFG native runtime
        uses: ./.github/actions/prepare-lsfg-native

      - name: Inject credentials
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          printf 'POSTHOG_API_KEY=%s\n' "${POSTHOG_API_KEY:-dummy}" > local.properties
          printf 'POSTHOG_HOST=%s\n' "${POSTHOG_HOST:-https://us.i.posthog.com}" >> local.properties

      - name: Inject dummy credentials
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          cat <<EOF > local.properties
          POSTHOG_API_KEY=dummy
          POSTHOG_HOST=https://us.i.posthog.com
          EOF

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run LSFG and FrameRating Legacy tests
        run: >-
          ./gradlew :app:testLegacyDebugUnitTest --no-daemon
          --tests app.gamenative.utils.LsfgVkManagerTest
          --tests app.gamenative.utils.LsfgBuildWorkflowContractTest
          --tests app.gamenative.utils.LsfgAdaptiveQuickMenuContractTest
          --tests app.gamenative.utils.LsfgSourceFpsLimitTest
          --tests app.gamenative.powercontrol.metrics.FrameTimeRingTest
          --tests com.winlator.widget.FrameRatingTest
          --tests com.winlator.widget.XServerFrameRatingRetargetContractTest

      - name: Assemble Legacy debug APK
        run: ./gradlew :app:assembleLegacyDebug --no-daemon

      - name: Split LegacyDebug APK for verified transfer
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/legacy/debug -maxdepth 1 -type f -name '*.apk' -print)
          if [[ ${#apks[@]} -ne 1 ]]; then
            printf 'Expected exactly one LegacyDebug APK, found %d\n' "${#apks[@]}" >&2
            printf '%s\n' "${apks[@]}" >&2
            exit 1
          fi
          mkdir -p /tmp/gamenative-legacy-debug
          apk=/tmp/gamenative-legacy-debug/gamenative-legacy-debug.apk
          cp "${apks[0]}" "$apk"
          sha256sum "$apk" | tee /tmp/gamenative-legacy-debug/gamenative-legacy-debug.apk.sha256
          split -n 4 -d -a 1 "$apk" /tmp/gamenative-legacy-debug/gamenative-legacy-debug.apk.part-
          for part in 0 1 2 3; do
            test -s "/tmp/gamenative-legacy-debug/gamenative-legacy-debug.apk.part-${part}"
          done
          cmp "$apk" <(cat /tmp/gamenative-legacy-debug/gamenative-legacy-debug.apk.part-{0,1,2,3})
          ls -lh /tmp/gamenative-legacy-debug/

      - name: Upload LegacyDebug part 0
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-legacy-debug-part-0
          path: /tmp/gamenative-legacy-debug/gamenative-legacy-debug.apk.part-0
          if-no-files-found: error
          compression-level: 0

      - name: Upload LegacyDebug part 1
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-legacy-debug-part-1
          path: /tmp/gamenative-legacy-debug/gamenative-legacy-debug.apk.part-1
          if-no-files-found: error
          compression-level: 0

      - name: Upload LegacyDebug part 2
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-legacy-debug-part-2
          path: /tmp/gamenative-legacy-debug/gamenative-legacy-debug.apk.part-2
          if-no-files-found: error
          compression-level: 0

      - name: Upload LegacyDebug part 3
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-legacy-debug-part-3
          path: /tmp/gamenative-legacy-debug/gamenative-legacy-debug.apk.part-3
          if-no-files-found: error
          compression-level: 0

      - name: Upload LegacyDebug checksum
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-legacy-debug-sha256
          path: /tmp/gamenative-legacy-debug/gamenative-legacy-debug.apk.sha256
          if-no-files-found: error
          compression-level: 0
