name: XServer Android 13 ART verifier guard

on:
  push:
    branches:
      - "fix/**"
  pull_request:
    branches:
      - "master"
    paths:
      - "app/src/main/java/app/gamenative/ui/screen/xserver/**"
      - "tools/verify-xserver-art-method.sh"
      - ".github/workflows/xserver-art-verifier.yml"
      - "app/build.gradle.kts"
      - "build.gradle.kts"
      - "gradle/**"

permissions:
  contents: read

concurrency:
  group: gamenative-xserver-art-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout GameNative
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Prepare pinned LSFG native runtime
        uses: ./.github/actions/prepare-lsfg-native

      - name: Rebuild Vulkan display renderer
        uses: ./.github/actions/prepare-vulkan-renderer-native

      - name: Inject non-production credentials
        shell: bash
        run: |
          cat > local.properties <<'EOF'
          POSTHOG_API_KEY=dummy
          POSTHOG_HOST=https://us.i.posthog.com
          STEAMGRIDDB_API_KEY=dummy
          CLOUD_PROJECT_NUMBER=dummy
          EOF

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble Legacy debug APK
        run: ./gradlew :app:assembleLegacyDebug --no-daemon

      - name: Inspect generated XServerScreen DEX method
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/legacy/debug -maxdepth 1 -type f -name '*.apk' -print)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one LegacyDebug APK, found ${#apks[@]}."
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          bash tools/verify-xserver-art-method.sh "${apks[0]}"

      - name: Verify native LSFG/Vulkan provenance is unchanged
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi
          git diff --name-only "$base_sha" "${{ github.sha }}" -- app/src/main/cpp/lsfg-vk-android app/src/main/cpp | tee /tmp/native-diff.txt
          if grep -q . /tmp/native-diff.txt; then
            echo "::error::Native LSFG/Vulkan sources changed in an XServer verifier-only fix."
            exit 1
          fi
