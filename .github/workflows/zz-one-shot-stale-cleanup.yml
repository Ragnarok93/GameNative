name: One-shot stale repository cleanup

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  actions: write
  issues: read
  pull-requests: read

jobs:
  cleanup:
    if: ${{ github.actor == github.repository_owner && github.event.issue.pull_request && github.event.comment.body == '/cleanup-stale-20260905' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prune stale branches and Actions runs
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = context.runId;
            const staleBranches = new Set([
              'ci/hitch-fix-legacydebug-20260905',
              'ci/lsfg-pacing-legacydebug-20260904',
              'ci/publish-lsfg-pacing-prerelease-20260904',
              'diag/legacydebug-gamedb-capture-20260904',
              'fix/lsfg-pacing-interface-20260904',
              'maintenance/cleanup-stale-20260905'
            ]);
            const nonSuccessCutoff = Date.now() - 12 * 60 * 60 * 1000;

            for (const branch of staleBranches) {
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
                core.info(`Deleted stale branch: ${branch}`);
              } catch (error) {
                if ([404, 422].includes(error.status)) {
                  core.info(`Branch already absent: ${branch}`);
                } else {
                  throw error;
                }
              }
            }

            const branches = await github.paginate(github.rest.repos.listBranches, { owner, repo, per_page: 100 });
            const liveBranches = new Set(branches.map(b => b.name));
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, { owner, repo, per_page: 100 });

            let deletedRuns = 0;
            for (const run of runs) {
              if (run.id === currentRunId || run.status !== 'completed') continue;
              const created = new Date(run.created_at).getTime();
              const branchGone = !!run.head_branch && !liveBranches.has(run.head_branch);
              const detachedOld = !run.head_branch && created < nonSuccessCutoff;
              const oldNonSuccess = created < nonSuccessCutoff && [
                'failure', 'cancelled', 'skipped', 'timed_out', 'startup_failure', 'action_required'
              ].includes(run.conclusion || '');
              if (!(branchGone || detachedOld || oldNonSuccess)) continue;
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                deletedRuns += 1;
              } catch (error) {
                core.warning(`Could not delete run ${run.id}: ${error.message}`);
              }
            }

            core.notice(`Deleted ${deletedRuns} stale workflow runs after pruning targeted branches.`);
